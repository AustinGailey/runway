# Runs the Runway test suite (./test.sh) on every push and pull request. The suite works offline: its tests use
# temp-dir git repos and a fake agent, and never touch a real ~/.ai-planner or launchctl.
# Test-only: no deploy, publish or release steps, and no secrets.
name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: ./test.sh
