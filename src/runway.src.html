<title>Runway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- tokens ---------- */
:root{
  --canvas:#F6F7F9; --panel:#FFFFFF; --nav:#F0F2F5; --hover:#EBEEF2; --sunk:#F1F3F6;
  --ink:#0F1217; --ink-2:#464C57; --ink-3:#848B96; --line:#E3E6EB; --line-2:#D2D6DD;
  --act:#E8590C; --act-hover:#D14F09; --act-ink:#FFFFFF; --act-soft:#FDEEE5;
  --st-todo:#9AA1AC; --st-running:#2F6FEB; --st-review:#C27C0E; --st-paused:#C27C0E; --st-done:#1F883D; --st-failed:#CF222E;
  --run-soft:#E7EFFD; --rev-soft:#FBF1E0; --done-soft:#E3F3E7; --fail-soft:#FCE8E9;
  --add:#1F883D; --add-bg:#E6F4EA; --del:#CF222E; --del-bg:#FCEBEC;
  --shadow-1:0 1px 2px rgba(15,18,23,.05); --shadow-2:0 8px 28px rgba(15,18,23,.12),0 1px 3px rgba(15,18,23,.08);
  --r:4px; --r-lg:8px;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --canvas:#0D0F12; --panel:#14171C; --nav:#101318; --hover:#1B1F26; --sunk:#181C22;
  --ink:#E9EBEE; --ink-2:#A6ACB5; --ink-3:#6D7480; --line:#22262D; --line-2:#2D323A;
  --act:#FF7A2E; --act-hover:#FF8C49; --act-ink:#1A0D05; --act-soft:#2E1C11;
  --st-todo:#5E6571; --st-running:#5B93FF; --st-review:#E3A23C; --st-paused:#E3A23C; --st-done:#46C46A; --st-failed:#FF6B6B;
  --run-soft:#152238; --rev-soft:#2B2213; --done-soft:#14271B; --fail-soft:#2E1517;
  --add:#46C46A; --add-bg:#132A1B; --del:#FF6B6B; --del-bg:#2E1517;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --canvas:#0D0F12; --panel:#14171C; --nav:#101318; --hover:#1B1F26; --sunk:#181C22;
  --ink:#E9EBEE; --ink-2:#A6ACB5; --ink-3:#6D7480; --line:#22262D; --line-2:#2D323A;
  --act:#FF7A2E; --act-hover:#FF8C49; --act-ink:#1A0D05; --act-soft:#2E1C11;
  --st-todo:#5E6571; --st-running:#5B93FF; --st-review:#E3A23C; --st-paused:#E3A23C; --st-done:#46C46A; --st-failed:#FF6B6B;
  --run-soft:#152238; --rev-soft:#2B2213; --done-soft:#14271B; --fail-soft:#2E1517;
  --add:#46C46A; --add-bg:#132A1B; --del:#FF6B6B; --del-bg:#2E1517;
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,select,textarea{font:inherit;color:inherit}
table{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
a{color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;letter-spacing:-.02em}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
:focus-visible{outline:2px solid var(--act);outline-offset:1px}
kbd{font:500 11px var(--mono);color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--panel)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--line-2);background:var(--panel);border-radius:var(--r);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow-1)}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--act);border-color:var(--act);color:var(--act-ink);box-shadow:none}
.btn.primary:hover{background:var(--act-hover)}
.btn.quiet{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.quiet:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--st-failed)}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
.btn.icon{width:30px;padding:0;justify-content:center}
.btn kbd{margin-left:2px}
input[type=text],input[type=number],input[type=datetime-local],input[type=search],select,textarea{height:32px;width:100%;padding:0 10px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r)}
textarea{height:auto;padding:8px 10px;line-height:1.5;resize:vertical;min-height:84px}
select[multiple]{height:auto;padding:4px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--act);box-shadow:0 0 0 3px var(--act-soft)}
.chk{width:15px;height:15px;accent-color:var(--act);margin:0;cursor:pointer}

/* status: one language everywhere — a dot and a word */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--st-todo);flex:none}
.st.running::before{background:var(--st-running);box-shadow:0 0 0 3px var(--run-soft);animation:pulse 1.6s ease-in-out infinite}
.st.review::before,.st.paused::before{background:var(--st-review)}
.st.done::before{background:var(--st-done)}
.st.parked::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--st-todo)}
.card.parked{opacity:.6} .card>.menuwrap{position:absolute;top:4px;right:4px;z-index:2} .card>.menuwrap+.cf,.card>.ct{padding-right:22px}.parkfold{display:block;width:100%;margin-top:6px;padding:6px 8px;border:0;background:transparent;color:var(--ink-2);text-align:left;cursor:pointer;font-size:12px}
.st.failed::before{background:var(--st-failed)}
.st.stale::before{background:transparent;box-shadow:inset 0 0 0 1.5px var(--st-failed)}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent}}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;background:var(--sunk);color:var(--ink-2);font-size:11px;font-weight:600;white-space:nowrap}
.tag.pass{background:var(--done-soft);color:var(--st-done)} .tag.fail{background:var(--fail-soft);color:var(--st-failed)}
.tag.warn{background:var(--rev-soft);color:var(--st-review)} .tag.run{background:var(--run-soft);color:var(--st-running)}
.tag.act{background:var(--act-soft);color:var(--act)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
.nav{background:var(--nav);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:12px 10px}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px 12px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand svg{width:22px;height:22px}
.brand .navclose{display:none;margin-left:auto}
.navscrim{display:none}
.cmdk{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden;border:1px solid var(--line-2);border-radius:var(--r);background:var(--panel);color:var(--ink-3);cursor:pointer;margin-bottom:12px;font-size:12.5px}
.cmdk span{overflow:hidden;text-overflow:ellipsis}
.cmdk kbd{margin-left:auto}
.navi{display:flex;align-items:center;gap:9px;width:100%;height:30px;padding:0 8px;border:0;border-radius:var(--r);background:transparent;color:var(--ink-2);font-weight:500;cursor:pointer;text-align:left}
.navi:hover{background:var(--hover);color:var(--ink)}
.navi[aria-current="page"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.navi .count{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--act);color:var(--act-ink);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.navi .count.calm{background:var(--sunk);color:var(--ink-2)}
.nav-sect{display:flex;align-items:center;justify-content:space-between;padding:18px 8px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.nav-sect button{border:0;background:transparent;color:var(--ink-3);cursor:pointer;border-radius:3px;width:20px;height:20px;display:grid;place-items:center}
.nav-sect button:hover{background:var(--hover);color:var(--ink)}
.projlist{overflow:auto;min-height:0;flex:1;margin:0 -2px;padding:0 2px}
.proj{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border:0;background:transparent;border-radius:var(--r);cursor:pointer;color:var(--ink-2);text-align:left}
.proj:hover{background:var(--hover);color:var(--ink)}
.proj[aria-current="true"]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.proj .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj.parked{opacity:.6}
.ring{width:14px;height:14px}
.navfoot{border-top:1px solid var(--line);padding:12px 6px 2px;display:flex;flex-direction:column;gap:10px}
.gauge .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;color:var(--ink-2)}
.gauge .row b{font-weight:600;color:var(--ink)}
.gbar{height:4px;border-radius:2px;background:var(--line);position:relative;overflow:hidden;margin-top:5px}
.gbar i{position:absolute;inset:0 auto 0 0;background:var(--ink-2);border-radius:2px}
.gbar i.est{background:repeating-linear-gradient(135deg,var(--act) 0 3px,transparent 3px 5px)}
.gbar.over i:first-child{background:var(--st-failed)}
.mac{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-2)}
.mac .dot{width:7px;height:7px;border-radius:50%;background:var(--st-todo)}
.mac .dot.on{background:var(--st-done)} .mac .dot.stale{background:var(--st-review)}
.mac button{margin-left:auto}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.head .crumb{display:flex;align-items:center;gap:8px;min-width:0}
.head .crumb .up{color:var(--ink-3);font-weight:500}
.head h1{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.head .acts{margin-left:auto;display:flex;gap:8px;align-items:center;padding:10px 0;flex-wrap:wrap}
.burger{display:none}
.content{flex:1;overflow:auto;min-height:0;padding:20px 24px 120px}
.banner{margin:0 0 16px;padding:10px 12px;border-radius:var(--r);background:var(--rev-soft);color:var(--ink);border:1px solid var(--line);font-size:12.5px;display:flex;gap:10px;align-items:center}

/* menu */
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:220px;background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:4px}
.menu button{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 10px;border:0;background:transparent;border-radius:var(--r);cursor:pointer;text-align:left;color:var(--ink)}
.menu button:hover{background:var(--hover)}
.menu button:disabled{opacity:.45;cursor:not-allowed}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}

/* ---------- inbox ---------- */
.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.list-h{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--sunk);font-size:12px;color:var(--ink-2);min-height:40px;flex-wrap:wrap}
.list-h .acts{margin-left:auto;display:flex;gap:6px}
.item{display:grid;grid-template-columns:20px 84px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:last-child{border-bottom:0}
.item:hover{background:var(--hover)}
.item.focus{background:var(--hover);box-shadow:inset 2px 0 0 var(--act)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{display:flex;gap:10px;align-items:center;color:var(--ink-3);font-size:12px;margin-top:2px;flex-wrap:wrap}
.item .a{display:flex;gap:6px;opacity:.0;transition:opacity .12s}
.item:hover .a,.item.focus .a{opacity:1}
.item .a.show{opacity:1}
.landbox{padding:14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:20px 84px minmax(0,1fr);gap:12px}
.landbox ul{margin:6px 0 0;padding-left:16px;color:var(--ink-2)}
.landbox .files{font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.landbox .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.zero{padding:72px 20px;text-align:center;color:var(--ink-2)}
.zero h2{font-size:16px;color:var(--ink);margin-bottom:6px}
.zero svg{width:40px;height:40px;color:var(--ink-3);margin-bottom:12px}
.acts-panel{border-bottom:1px solid var(--line)}
.act-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--line)}
.act-row:last-child{border-bottom:0}
.act-row.running{background:var(--run-soft)}
.act-row.bad .act-ic{color:var(--st-failed)}
.act-row.ok .act-ic{color:var(--st-done, var(--ink-2))}
.act-row .steps{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.act-row .steps .tag{margin-right:4px}
.bks{display:grid;gap:10px;margin:10px 0}
.bk{display:grid;gap:4px;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--canvas)}
.bk .opt{display:flex;gap:8px;align-items:center;font-size:12.5px;cursor:pointer}
.bk .opt input[type=text]{flex:1;min-width:0}
.chat [hidden],.chatfab[hidden]{display:none!important}
.chatfab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:35;display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:0;border-radius:20px;background:var(--act);color:var(--act-ink);font-weight:600;box-shadow:var(--shadow-2);cursor:pointer}
.chatfab:hover{background:var(--act-hover)}
.chatfab svg.i{stroke:currentColor}
.chat{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--shadow-2);z-index:40;display:none;flex-direction:column}
.chat.open{display:flex}
.chat-h{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chat-h b{display:flex;gap:6px;align-items:center}
.chat-h .faint{font-size:12px;width:100%;order:3}
.chat-log{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.chat .msg{max-width:92%;font-size:13px;line-height:1.5}
.chat .msg.user{align-self:flex-end;background:var(--act-soft);padding:8px 10px;border-radius:var(--r-lg)}
.chat .msg.assistant{align-self:flex-start}
.chat .msg code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:0 3px;border-radius:3px}
.cacts{display:grid;gap:6px;margin-top:8px}
.cact{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--canvas);font-size:12.5px}
.cact.applied{opacity:.75}.cact.dismissed{opacity:.5}
.cact-b{display:flex;gap:4px;flex-shrink:0}
.chat-f{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:8px}
.chat-in{width:100%;resize:vertical;min-height:52px}
@media (max-width:700px){.chat{width:100%}}
.crumb-p{border:0;background:transparent;padding:0;font:inherit;font-weight:500;color:var(--ink-3);cursor:pointer;white-space:nowrap}
.crumb-p:hover{color:var(--ink)}
.pisw{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:transparent;border-radius:var(--r);padding:3px 6px;margin:0 -6px;cursor:pointer;min-width:0;color:var(--ink)}
.pisw:hover,.pisw[aria-expanded="true"]{background:var(--hover);border-color:var(--line)}
.pisw svg.i{width:14px;height:14px;color:var(--ink-3)}
.menu button.menu-g.toggle svg.i{width:12px;height:12px}
.pisw-step{display:inline-flex}
.menu.left{left:0;right:auto}
.pisw-m{min-width:min(380px,90vw);max-height:70vh;overflow:auto}
.menu button[role="menuitemradio"]{display:grid;grid-template-columns:minmax(0,1fr) auto 56px 34px;gap:8px;align-items:center;height:34px}
.menu button[role="menuitemradio"][aria-checked="true"]{background:var(--act-soft)}
.pisw-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pisw-p{height:4px;border-radius:2px;background:var(--line);overflow:hidden;display:block}
.pisw-p i{display:block;height:100%;background:var(--st-done)}
.menu-g{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
.menu button.menu-g.toggle{height:28px;text-transform:uppercase;font-size:11px;color:var(--ink-3)}
.rmlist .rm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.rmlist .rm:last-child{border-bottom:0}
.rm.closed{opacity:.8}
.rm-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rm-o{font-size:12.5px;margin-top:3px;max-width:90ch}
.rm-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:8px 0 6px;max-width:520px}
.rm-bar i{display:block;height:100%;background:var(--st-done)}
.rm-m{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.rm-a{display:flex;gap:4px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}
.rm-ord{display:inline-flex}
.proj.child{padding-left:26px;height:26px;font-size:12.5px}
@media (max-width:900px){.rmlist .rm{grid-template-columns:1fr}.rm-a{justify-content:flex-start}}
.progress{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--run-soft);font-size:12.5px}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--st-running);border-right-color:transparent;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- board ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto}
.head .tabs{flex-basis:calc(100% + 48px);margin:0 -24px;padding:0 18px;border-top:1px solid var(--line)}
.tab{height:40px;padding:0 10px;border:0;background:transparent;color:var(--ink-2);font-weight:500;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab .num{color:var(--ink-3)}
.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:16px;margin-bottom:20px}
.ov-l{display:flex;flex-direction:column;gap:12px}
.ov-l p{margin:0;color:var(--ink-2);max-width:72ch}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat .k{font-size:11.5px;color:var(--ink-3);font-weight:500}
.stat .v{font-size:18px;font-weight:700;font-family:var(--mono);letter-spacing:-.03em}
.repo{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.repo.missing{color:var(--st-failed)}
.burn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;position:relative}
.burn .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-size:11.5px;color:var(--ink-3)}
.burn .hd b{color:var(--ink-2);font-weight:600}
.burn svg{display:block;width:100%;height:auto;overflow:visible}
.burn .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--canvas);font-size:11px;padding:5px 7px;border-radius:var(--r);white-space:nowrap;transform:translate(-50%,-115%)}
.lanes{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.lane{flex:0 0 296px;display:flex;flex-direction:column;gap:6px;border-radius:var(--r-lg);padding:6px}
.lane.drop{background:var(--act-soft)}
.lane-h{padding:4px 6px 8px;display:flex;flex-direction:column;gap:6px}
.lane-h .r1{display:flex;align-items:center;gap:8px}
.lane-h h3{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-h .r1 .num{margin-left:auto;color:var(--ink-2)}
.lane-h .g{font-size:12px;color:var(--ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fitbar{height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.fitbar i{display:block;height:100%;background:var(--ink-2)}
.fitbar.over i{background:var(--st-failed)}
.lane-h .r3{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3)}
.lane-h .r3 .over{color:var(--st-failed);font-weight:600}
.lane-h .r3 .btn{margin-left:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1);position:relative}
.card:hover{border-color:var(--line-2)}
.card.sel{border-color:var(--act);box-shadow:0 0 0 1px var(--act)}
.card .clive{margin-top:6px;font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.card .ct{font-weight:600;line-height:1.35;padding-right:22px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .cf{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:11.5px}
.card .cf .num{margin-left:auto;color:var(--ink-2)}
.card .cf .num.big{color:var(--st-failed)}
.card .pick{position:absolute;top:10px;right:10px;opacity:0}
.card:hover .pick,.card.sel .pick,.card .pick:focus{opacity:1}
.card.done .ct{color:var(--ink-3);font-weight:500;text-decoration:line-through;text-decoration-color:var(--line-2)}
.addcard{height:32px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:transparent;color:var(--ink-3);cursor:pointer;font-weight:500}
.addcard:hover{color:var(--ink);border-color:var(--ink-3)}
.donefold{border:0;background:transparent;color:var(--ink-3);font-size:12px;font-weight:500;text-align:left;cursor:pointer;padding:4px 6px}
.donefold:hover{color:var(--ink)}
.newlane{flex:0 0 200px;height:44px;border:1px dashed var(--line-2);border-radius:var(--r-lg);background:transparent;color:var(--ink-3);cursor:pointer;font-weight:500;margin-top:6px}
.card.dragging{opacity:.5}

/* ---------- idea map ---------- */
.sparkbar{display:flex;gap:8px;margin-bottom:12px}
.sparkbar input[type=text]{flex:1}
.sparkbar select{width:auto;min-width:170px;flex:none}
.idea-outcome{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r-lg);padding:10px 14px;margin-bottom:12px}
.idea-outcome .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.idea-outcome h2{font-size:14px;font-weight:700;margin-top:2px}
.idea-lanes{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.idea-lane{flex:0 0 280px;display:flex;flex-direction:column;gap:6px;border-radius:var(--r-lg);padding:6px;background:var(--sunk)}
.idea-lane.drop{background:var(--act-soft)}
.idea-lane .lane-h .r1{gap:6px}
.idea-lane .ttl-sm{height:28px;font-weight:700;font-size:13px;border-color:transparent;background:transparent;padding:0 4px}
.idea-lane .ttl-sm:hover,.idea-lane .ttl-sm:focus{border-color:var(--line-2);background:var(--panel)}
.idea-loose{border-radius:var(--r-lg);padding:6px;background:var(--sunk);margin-top:4px}
.idea-loose.drop{background:var(--act-soft)}
.ideacard .ct{padding-right:0}
.ideacard.ghost{border-style:dashed;opacity:.85;animation:ghostin .18s ease-out}
@keyframes ghostin{from{opacity:0;transform:translateY(4px)}to{opacity:.85;transform:none}}
.ideacard.fading,.bet-card.fading{opacity:.6;border-style:dashed}
.appetite-sel{height:26px;width:auto;padding:0 6px;font-size:12px;border-radius:var(--r)}
.bet-group{margin-bottom:16px}
.bet-group h3{font-size:13px;font-weight:700;margin-bottom:8px}
.bet-group .bet-card{cursor:default;margin-bottom:8px}
.bet-form{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.journal-entry{cursor:default;margin-bottom:10px}
.journal-entry .ct{padding-right:0}
.duel-q{font-size:15px;font-weight:700;text-align:center;margin-block:4px 14px}
.duel-pair{display:flex;align-items:stretch;gap:14px}
.duel-card{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow-1)}
.duel-card:hover,.duel-card:focus-visible{border-color:var(--act);box-shadow:0 0 0 2px var(--act-soft)}
.duel-card .duel-title{font-weight:700;font-size:15px;line-height:1.35}
.duel-vs{align-self:center;color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;flex:0 0 auto}
.duel-actions{display:flex;justify-content:center;gap:8px;margin-block:14px 4px}
.duel-hint{text-align:center;color:var(--ink-3);font-size:11.5px;margin-top:2px}
.duel-progress{text-align:center;color:var(--ink-3);font-size:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.duel-top5{margin-top:8px}
.duel-top5 .lbl{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);text-align:center}
.duel-top5 ol{margin:4px auto 0;padding-left:20px;max-width:320px;font-size:12.5px;text-align:left}
@media (max-width:480px){
  .idea-lanes{flex-direction:column;overflow-x:visible}
  .idea-lane{width:100%}
  .sparkbar{flex-wrap:wrap}
  .sparkbar select{flex:1;min-width:0}
  .duel-pair{gap:8px}
  .duel-card{padding:12px 8px}
  .duel-card .duel-title{font-size:13px}
}

/* ---------- assumption map (Bland): importance x evidence grid in the idea drawer ---------- */
.riskdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--st-review);margin-left:6px;vertical-align:middle}
.asgrid{position:relative;height:200px;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);margin:8px 0 6px;overflow:hidden}
.asgrid::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.asgrid::after{content:"";position:absolute;top:50%;left:0;right:0;height:1px;background:var(--line)}
.asq-first{position:absolute;left:0;top:0;width:50%;height:50%;background:var(--rev-soft)}
.asq-label{position:absolute;left:8px;top:6px;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--st-review);pointer-events:none}
.asaxis{position:absolute;left:50%;transform:translateX(-50%);font-size:10px;color:var(--ink-3);pointer-events:none}
.asaxis.top{top:4px} .asaxis.bottom{bottom:4px}
.aschip{position:absolute;transform:translate(-50%,-50%);max-width:130px;padding:3px 8px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);font-size:11px;font-weight:600;cursor:grab;box-shadow:var(--shadow-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aschip:hover{border-color:var(--act)}
.aschip.sel{border-color:var(--act);box-shadow:0 0 0 2px var(--act-soft)}
.aschip.dragging{opacity:.4}
.asrows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.asrow{border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 10px}
.asrow .ar1{display:flex;gap:6px;align-items:flex-start}
.asrow textarea{flex:1;resize:vertical}
.asrow .ar-kind{width:110px;flex:none}
.asrow .ar2{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
/* chunk dock */
.dock{position:fixed;left:calc(236px + (100% - 236px)/2);transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--canvas);border-radius:10px;box-shadow:var(--shadow-2);padding:8px 8px 8px 16px;display:flex;align-items:center;gap:16px;max-width:calc(100% - 236px - 32px);flex-wrap:wrap}
.dock .sum{font-weight:600;white-space:nowrap}
.dock .sum span{font-weight:400;opacity:.7}
.dock .mini{width:140px}
.dock .mini .gbar{background:rgba(255,255,255,.18);margin:0}
.dock .mini .gbar i.est{background:var(--act)}
.dock .mini .lbl{font-size:11px;opacity:.7;display:flex;justify-content:space-between}
.dock .btn{box-shadow:none}
.dock .btn.quiet{color:var(--canvas)} .dock .btn.quiet:hover{background:rgba(255,255,255,.12)}
.dock .btn:not(.primary):not(.quiet){background:transparent;border-color:rgba(255,255,255,.25);color:var(--canvas)}
.dock .warn{flex-basis:100%;font-size:12px;color:#FFB38A;padding-bottom:2px}
.dock .warn:empty{display:none}

/* ---------- runs ---------- */
.table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.table th{font-size:11.5px;font-weight:600;color:var(--ink-3);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
.table td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.chunk{cursor:pointer}
.table tr.chunk:hover td{background:var(--hover)}
.table tr.sub td{background:var(--sunk);padding-top:8px;padding-bottom:8px}
.table tr.sub td:first-child{padding-left:36px}
.table .r{text-align:right}
.caret{display:inline-block;width:12px;color:var(--ink-3);transition:transform .12s}
.open .caret{transform:rotate(90deg)}
.tbl-wrap{overflow-x:auto}
.sect{font-size:12px;font-weight:600;color:var(--ink-2);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
details.hist > summary{cursor:pointer;list-style:none}
details.hist > summary::-webkit-details-marker{display:none}

/* ---------- panels & modals ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:40;display:flex;justify-content:flex-end;animation:fade .12s ease-out}
.scrim.center{justify-content:center;align-items:flex-start;padding:8vh 16px;overflow:auto}
@keyframes fade{from{opacity:0}}
.drawer{width:min(620px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;box-shadow:var(--shadow-2);animation:slide .16s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
.drawer .dh{padding:14px 20px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.drawer .dh .r1{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.drawer .dh .r1 .btn{margin-left:auto}
.drawer .ttl{border:0;padding:0;height:auto;font-size:18px;font-weight:700;letter-spacing:-.01em;background:transparent;box-shadow:none!important}
.drawer .tabs{margin:0 -20px;padding:0 14px;border-bottom:0;background:transparent}
.drawer .db{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.drawer .df{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drawer .df .sp{flex:1}
.modal{width:min(720px,100%);background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-2);display:flex;flex-direction:column;animation:pop .14s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:.6}}
.modal > *{padding-inline:20px}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 4px}
.modal h2{font-size:16px;font-weight:700}
.modal .mbody{display:flex;flex-direction:column;gap:14px;padding-block:12px}
.modal .row-end{padding-block:12px 16px;border-top:1px solid var(--line);margin-top:4px}
.modal > p,.modal > .note,.modal > .fld,.modal > .grid2,.modal > .grid3,.modal > .plan-tree,.modal > .picklist,.modal > .stream,.modal > div:not(.mhead):not(.row-end){margin-block:6px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label,.fld .lb{font-size:12px;font-weight:600;color:var(--ink-2)}
.fld .hint{font-size:11.5px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.note{font-size:12.5px;color:var(--ink-2);background:var(--sunk);padding:10px 12px;border-radius:var(--r);border:1px solid var(--line)}
.note.bad{background:var(--fail-soft);color:var(--st-failed);border-color:transparent}
.note.ok{background:var(--done-soft);color:var(--st-done);border-color:transparent}
.note.act{background:var(--act-soft);color:var(--ink);border-color:transparent}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
pre.code{font-family:var(--mono);font-size:11.5px;line-height:1.55;background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow:auto;margin:0;white-space:pre-wrap;max-height:420px}
textarea.code{font-family:var(--mono);font-size:11.5px}
.diff{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-family:var(--mono);font-size:11.5px;line-height:1.55}
.diff .fh{background:var(--sunk);padding:6px 10px;border-bottom:1px solid var(--line);font-weight:600;color:var(--ink);display:flex;gap:10px}
.diff .fh .num{margin-left:auto}
.diff pre{margin:0;overflow-x:auto}
.diff .ln{display:block;padding:0 10px;white-space:pre}
.diff .ln.a{background:var(--add-bg);color:var(--add)} .diff .ln.d{background:var(--del-bg);color:var(--del)} .diff .ln.h{color:var(--ink-3);background:var(--canvas)}
.plan-tree,.picklist{border:1px solid var(--line);border-radius:var(--r);max-height:46vh;overflow:auto}
.plan-tree .pi{padding:10px 12px;border-bottom:1px solid var(--line);background:var(--sunk);font-weight:700}
.plan-tree .sp{padding:8px 12px 4px 20px;font-weight:600;display:flex;justify-content:space-between}
.plan-tree .tk{padding:3px 12px 3px 32px;display:flex;justify-content:space-between;gap:10px}
.picklist label{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.picklist small{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.stream{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);background:var(--sunk);border-radius:var(--r);padding:10px;max-height:160px;overflow:auto;white-space:pre-wrap}
.cal{width:100%;border-collapse:collapse;font-size:12px}
.cal th,.cal td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.cal td.num,.cal th.num{text-align:right}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:3px;background:var(--sunk);color:var(--ink-2);font-size:11px;font-weight:600}
.fit.over{color:var(--st-failed)}

/* command palette */
.pal{width:min(620px,100%);background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-2);overflow:hidden;animation:pop .12s ease-out}
.pal input{height:48px;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:15px;padding:0 16px;box-shadow:none!important}
.pal ul{list-style:none;margin:0;padding:6px;max-height:50vh;overflow:auto}
.pal li{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--r);cursor:pointer;color:var(--ink-2)}
.pal li .g{margin-left:auto;font-size:11.5px;color:var(--ink-3)}
.pal li[aria-selected="true"]{background:var(--hover);color:var(--ink)}
.pal .ft{display:flex;gap:14px;padding:8px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}

.toast{position:fixed;right:20px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--canvas);padding:10px 14px;border-radius:var(--r-lg);font-weight:500;font-size:12.5px;max-width:min(420px,calc(100% - 40px));box-shadow:var(--shadow-2)}


/* ---------- usage match ---------- */
.matchbtn{border:0;background:transparent;color:var(--ink-3);font-size:11px;text-align:left;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:2px;margin-top:-4px}
.matchbtn:hover{color:var(--ink)}
/* ---------- land card ---------- */
.landbox .state{display:flex;gap:8px;align-items:baseline;margin-top:10px}
.landbox .state b{white-space:nowrap}
.landbox .why{color:var(--ink-2);margin:4px 0 0}
.landbox .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.landbox .files code{font:11.5px var(--mono);background:var(--sunk);padding:1px 6px;border-radius:3px}
.landbox input[type=text]{max-width:520px;margin-top:8px}
.stepdot{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--act);color:var(--act-ink);font-size:11px;font-weight:700;flex:none}
/* ---------- run debugging ---------- */
.diag{display:inline-flex;align-items:center;gap:5px;color:var(--st-failed);font-weight:500}
.diag svg{width:13px;height:13px}
.diagbox{border:1px solid var(--line);border-left:3px solid var(--st-failed);border-radius:var(--r-lg);padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.diagbox .dg-h{display:flex;align-items:center;gap:8px}
.diagbox .dg-h svg{color:var(--st-failed)}
.diagbox .dg-h .faint{margin-left:auto;font-size:12px}
/* ---------- ideas ---------- */
.score{position:relative;height:18px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:90px}
.score i{position:absolute;inset:0 auto 0 0;background:var(--act-soft);border-right:2px solid var(--act)}
.score span{position:relative;padding-left:6px;line-height:18px;font-weight:600}
.shapes{display:flex;flex-direction:column;gap:10px}
.shape{display:block;border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;cursor:pointer;position:relative}
.shape:hover{border-color:var(--line-2)}
.shape.on{border-color:var(--act);box-shadow:0 0 0 1px var(--act)}
.shape input{position:absolute;top:14px;right:14px;accent-color:var(--act)}
.shape .sh-h{display:flex;gap:8px;align-items:center;padding-right:24px}
.shape .sh-s{color:var(--ink-2);margin-top:4px}
/* Pre-mortem flip card: the face shown (front = shapes, back = how it fails) is swapped outright, not held in two
   stacked layers, so it never needs a fixed height for content of very different lengths. flipface replays a short
   reveal each time its content is swapped; prefers-reduced-motion turns it off globally (see the *{} rule up top). */
.flipface{animation:flipreveal .3s ease}
@keyframes flipreveal{from{opacity:0;transform:rotateY(80deg)}to{opacity:1;transform:rotateY(0)}}
.flip-btn{margin-top:10px}
.premortem{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
/* ---------- task table ---------- */
.tbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tbar input[type=search]{max-width:280px}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:26px;padding:0 9px;border:1px solid var(--line-2);border-radius:13px;background:var(--panel);font-size:12px;color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.table th.sortable{cursor:pointer;user-select:none}
.table th.sortable:hover{color:var(--ink)}
.table tr.trow{cursor:pointer}
.table tr.trow:hover td{background:var(--hover)}
.table tr.trow.picked td{background:var(--act-soft)}
.table td.tt{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bulk{position:sticky;top:0;z-index:4;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;margin-bottom:10px;background:var(--ink);color:var(--canvas);border-radius:var(--r-lg)}
.bulk select{height:28px;width:auto;background:transparent;color:var(--canvas);border-color:rgba(255,255,255,.3)}
.bulk select option{color:var(--ink);background:var(--panel)}
.bulk .btn{box-shadow:none;background:transparent;color:var(--canvas);border-color:rgba(255,255,255,.3)}

const pad = n => String(n).padStart(2,"0");

/* ---------- derived ---------- */
const proj = id => S.projects.find(p => p.id === id);
const task = id => S.tasks.find(t => t.id === id);

const sprintsOf = piId => S.sprints.filter(x => x.piId === piId).sort(byOrder);
const tasksOf = sid => S.tasks.filter(x => x.sprintId === sid).sort(byOrder);

const subLabel = pid => { const p = S.projects.find(x => x.id === pid); return p ? (p.shortName || (p.parentId ? p.name : "Core")) : "?"; };
const tasksOfProject = pid => { const p = S.projects.find(x => x.id === pid); const ids = p?.parentId ? [pid] : familyIds(pid); return S.tasks.filter(t => ids.includes(t.projectId)); };
const launchable = t => t.status === "todo" || t.status === "failed" || t.status === "paused";
const helperOn = () => S.helper && S.helper.v >= 2;
const schedulerOn = () => helperOn() && S.helper.v >= 3 && S.helper.scheduler && S.helperAt - S.helper.scheduler*1000 < 5*60e3;

/* Estimate accuracy comes from the `estimates` ledger: one immutable row per finished run.
   Calibration = geometric mean of actual ÷ estimate over the 20 most recent usable runs of the same
   model and kind (then kind, then all), clamped to ×0.25–×4. Runs that produced nothing, were resumed
   or stopped are logged but not used. */
function history(){ return S.estimates.filter(r => r.usable && r.est > 0 && r.actual > 0).sort((a,b) => (a.at||0) - (b.at||0)); }
function ratioOf(list){ const rs = list.slice(-20); return Math.min(4, Math.max(.25, Math.exp(rs.reduce((s,r) => s + Math.log(r.actual / r.est), 0) / rs.length))); }
function calibration(){ const h = history(); return { factor: h.length >= 3 ? ratioOf(h) : 1, n: h.length }; }
function factorFor(t){
  const h = history(); const model = t.model || S.settings.defaultModel, kind = t.kind || "code";
  const mk = h.filter(x => x.model === model && x.kind === kind); if (mk.length >= 2) return ratioOf(mk);
  const k = h.filter(x => x.kind === kind); if (k.length >= 2) return ratioOf(k);
  return h.length >= 3 ? ratioOf(h) : 1;
}
const adjT = t => (t.estTokens || 0) * factorFor(t);
const adjSum = ts => ts.reduce((a,t) => a + adjT(t), 0);
/* Planner calibration: one multiplier per model and kind, from the same usable runs. Fewer than 3 runs gives ×1, and the
   multiplier never leaves ×0.5–×2. The helper computes the same table from every run on this Mac (status.calibration);
   it is used when it has rows, else the page's own runs. Mirrors calibration_table() in helper/runway.py. */
const CAL = { min: 3, lo: .5, hi: 2, window: 20 };
function calibrationTable(){
  const hv = helperOn() && S.helper.calibration?.table;
  if (hv?.length) return hv;
  const g = {}; for (const r of history()) (g[r.model + "\u0001" + r.kind] ||= { model: r.model, kind: r.kind, rs: [] }).rs.push(r);
  return Object.values(g).map(({ model, kind, rs }) => { const w = rs.slice(-CAL.window), n = w.length;
    const factor = n >= CAL.min ? Math.min(CAL.hi, Math.max(CAL.lo, Math.exp(w.reduce((s,r) => s + Math.log(r.actual / r.est), 0) / n))) : 1;
    return { model, kind, n, factor: Math.round(factor * 10000) / 10000 }; }).sort((a,b) => b.n - a.n);
}
function calibrationFor(model, kind){ return calibrationTable().find(x => x.model === model && x.kind === kind) || { model, kind, n: 0, factor: 1 }; }
function calTable(){ return calibrationTable().map(x => ({ k: x.model + " · " + x.kind, n: x.n, r: x.factor })); }

/* Usage: from the helper's scan of local session logs when installed, else from Runway's own runs. */
function runningRemaining(){ return S.tasks.filter(t => t.status === "running" && !queuedChunk(t)).reduce((a,t) => a + adjT(t), 0); }
function queuedChunk(t){ const c = S.chunks.find(c => c.id === t.run?.chunkId); return c && c.status === "queued" ? c : null; }
function windowUsage(){
  { const r = windowReset(); if (r){ const v = usedSince(r - 5*3600e3); if (v != null) return { used: v, reset: r, src:"logs" }; } }
  const u = helperOn() && S.helper.usage;
  if (u && !u.error){ const b = u.block; return { used: b ? b.used : 0, reset: b ? b.end*1000 : null, src:"logs" }; }

  return { used, reset:null, src:"runs" };

/* Tokens since a moment, from the helper's hourly buckets (hour granularity). */
function usedSince(ms){
  const u = helperOn() && S.helper.usage; if (!u?.hours) return null;

  u.hours.forEach((v, i) => { if (u.h0 + i >= fromH) sum += v; });

/* Your plan's reset times, as you entered them from Claude's usage screen. Each rolls forward by its period once passed. */
function nextReset(at, periodMs){ if (!at) return null; let t = at; while (t <= now()) t += periodMs; return t; }

  const rs = (cal()[kind] || []).filter(r => r.pct >= 3 && r.tokens > 0).slice(-6).map(r => r.tokens * 100 / r.pct).sort((a,b) => a - b);

const weekBudget = () => impliedBudget("week") || S.settings.weekBudget;
function weekUsage(){
  const r = weekReset(); if (r){ const v = usedSince(r - 7*86400e3); if (v != null) return v; }
  const u = helperOn() && S.helper.usage; if (u && !u.error) return u.week;

function depsMet(t){ return (t.deps||[]).every(d => { const x = task(d); return !x || x.status === "done" || x.status === "dropped"; }); }

const bkNorm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();

  const sp = S.sprints.find(x => x.id === t.sprintId), pi = sp && S.pis.find(x => x.id === sp.piId);

/* ---------- brief lint ---------- */
/* The wording this looks for, kept in one place so it's easy to tune without touching the logic below.
   vague: words that read fine but give a reviewer nothing to check against a diff.
   observable: if a criterion matches this too, it already names something checkable (a file, command, test, number,

const briefLintKey = x => x.kind + "|" + x.criterion;
/* A pure check of a task's brief before it ever reaches an agent. Looks only at what the task already has (no
   network, no sampling), so it can run on every render. Returns the issues the task hasn't dismissed, oldest rule
   first: no acceptance criteria at all, a criterion with no observable check, a criterion needing something outside
   what an agent can do here, too many criteria (or a big estimate with more than a few), and a starting point
   described in prose instead of the task's own fields. */
function briefLint(t, p){
  const issues = [];
  const lines = (t.acceptance || "").split("\n").map(s => s.replace(/^[-*\d.)\s]+/, "").trim()).filter(Boolean);
  if (!lines.length) issues.push({ kind:"no-criteria", criterion:"", why:"No acceptance criteria: a reviewer has nothing to check the change against.",
    fix:"Add 1–6 criteria naming the file, command, test or output that proves each is done." });
  for (const c of lines){
    const low = c.toLowerCase();
    if (BRIEF_LINT_WORDS.vague.some(w => low.includes(w)) && !BRIEF_LINT_WORDS.observable.test(c))
      issues.push({ kind:"untestable", criterion:c, why:"No file, command, test, number, page or output is named, so a reviewer can't check this from a diff.",
        fix:"Name the file, command, test or output that proves it." });
    const out = BRIEF_LINT_WORDS.outsideAgent.find(([re]) => re.test(c));
    if (out) issues.push({ kind:"outside-agent", criterion:c, why:`This needs ${out[1]}, which a headless agent can't do here.`,
      fix:"Drop it from acceptance, or rewrite it as something the diff can prove; handle the rest yourself." });
  }
  const chunkBudget = (typeof S !== "undefined" && S.settings && S.settings.chunkBudget) || DEFAULTS.chunkBudget || 2000000;
  if (lines.length > 6) issues.push({ kind:"too-big", criterion:"", why:`${lines.length} acceptance criteria is a lot for one task to finish in one run.`,
    fix:"Split into smaller tasks with fewer criteria each." });
  else if ((t.estTokens||0) > chunkBudget * .5 && lines.length > 4) issues.push({ kind:"too-big", criterion:"", why:"The estimate is over half a chunk and has more than 4 criteria.",
    fix:"Split into smaller tasks." });
  const detail = t.detail || "";
  const startAt = /\b(start(?:ing)?(?:\s+point)?|begins?|beginning|based?)\b/i.exec(detail);
  if (startAt){
    const window = detail.slice(startAt.index, startAt.index + 80);
    if (/\bbranch\b/i.test(window)) issues.push({ kind:"ambiguous-start", criterion:"", why:"The brief names a branch as the starting point in prose; branches move or get deleted after merging.",
      fix:"Set it in the task's \"Start from branch\" field instead, and remove the line from the brief." });
    else if (/\btask\b/i.test(window)) issues.push({ kind:"ambiguous-start", criterion:"", why:"The brief names another task as the starting point in prose, so a rerun may not see the same thing.",
      fix:"Add that task to \"Waits on\" so this one starts from its merged work, and remove the line from the brief." });
  }
  for (const s of openChoices(detail)) issues.push({ kind:"open-choice", criterion:s, why:"The brief leaves a choice open (an \"or\" between alternatives, TBD, \"decide\" or \"either\"), and nobody is there to answer it mid-run.",
    fix:"Make the choice in the design round and reference it as \"decision <id>\", or write the answer into the brief." });
  const dismissed = t.briefLintDismissed || [];
  return issues.filter(x => !dismissed.includes(briefLintKey(x)));
}
/* Sentences of a brief that leave a choice to the agent: "A or B", TBD, "decide", "either". A sentence that points at a
   decision ("decision db-choice") has handed the choice to the design round, so it is fine. Code spans are ignored. */
const OPEN_CHOICE_RE = /\bTBD\b|\bto be (decided|determined)\b|\bdecide\b|\beither\b|\b[\w'-]+\s+or\s+[\w'-]+/i;
const OPEN_CHOICE_OK_RE = /\b(one|zero|two|more|less|fewer) or (more|less|fewer|two|three)\b|\bmore or less\b|\band\/or\b|\bor (so|later|else|otherwise|not)\b|\bwhether or not\b|\bif not\b/gi;
const DECISION_REF_RE = /\bdecision\s*[:#]?\s*(?=[\w-]*[-\d])[\w-]+|\[d:[\w-]+\]/i;
function openChoices(detail){
  const out = [];
  for (const raw of String(detail || "").split(/(?<=[.!?])\s+|\n+/)){
    const s = raw.replace(/`[^`]*`/g, " ").replace(OPEN_CHOICE_OK_RE, " ").trim();
    if (!s || !OPEN_CHOICE_RE.test(s) || DECISION_REF_RE.test(s)) continue;
    out.push(raw.replace(/^[-*\d.)\s]+/, "").trim().slice(0, 140));
  }
  return [...new Set(out)];
}

/* ---------- data layer ---------- */
const queues = new Map();
function write(col, id, fn){
  const key = col + "/" + id;
  const next = (queues.get(key) || Promise.resolve()).catch(() => {}).then(fn).catch(e => { console.error(e); toast(dbErrCopy(e)); throw e; });
  queues.set(key, next); return next;
}
function dbErrCopy(e){
  const c = e && e.code;
  if (c === "quota_exceeded") return "The planner database is full. Delete finished projects or runs to make room.";
  if (c === "invalid_argument") return "That change was refused. You may only have view access to this planner.";
  if (c === "resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  return "Could not save that change. Check your connection and try again.";
}
function localApply(col, id, data, mode){
  const arr = S[col]; if (!Array.isArray(arr)) return;
  const i = arr.findIndex(x => x.id === id);
  if (mode === "delete"){ if (i >= 0) arr.splice(i,1); return; }
  if (mode === "set" || i < 0){ const v = { ...data, id }; if (i >= 0) arr[i] = v; else arr.push(v); }

/* Optimistic writes: a change shows on screen the moment it's made, not when the database echoes it back.
   Each pending write is overlaid on the live data until a snapshot carries it (its updatedAt has caught up), the write
   fails (rolled back), or 30 seconds pass. */
const optimistic = new Map(); // "col/id" -> { mode: "set"|"update"|"delete", data, at }
S._raw = {};
function overlay(col, arr){
  if (!optimistic.size) return arr;
  let out = arr;
  for (const [key, o] of [...optimistic]){
    if (!key.startsWith(col + "/")) continue;
    const id = key.slice(col.length + 1), i = out.findIndex(x => x.id === id), cur = out[i];
    if (now() - o.at > 30000 || (o.mode !== "delete" && cur && (cur.updatedAt || 0) >= o.at) || (o.mode === "delete" && i < 0)){ optimistic.delete(key); continue; }
    if (out === arr) out = [...arr];
    if (o.mode === "delete") out.splice(i, 1);
    else if (i >= 0) out[i] = o.mode === "set" ? { ...o.data, id } : { ...cur, ...o.data, id };

}
function refreshCol(col){

}
let renderQueued = false;
function softRender(){ if (renderQueued) return; renderQueued = true; setTimeout(() => { renderQueued = false; render(); }, 16); } // a timer, not requestAnimationFrame, which stalls in background tabs
function optimisticWrite(col, id, mode, data, fn){
  const key = col + "/" + id, prev = optimistic.get(key);
  optimistic.set(key, { mode: mode === "update" && prev?.mode === "set" ? "set" : mode, data: mode === "update" && prev ? { ...prev.data, ...data } : data, at: data?.updatedAt || now() });

  return optimisticWrite(col, id, "set", body, () => S.db.collection(col).doc(id).set(body));
}
// A change to what agents may do or need (commands, folders, launch checks, trust) can clear a permission, access or environment blocker.
const SETTINGS_KEYS = ["allowedTools","readDirs","requires","trust","baseBranch","worktrees","agentNotes"];
function patch(col, id, data){
  const body = { ...data, updatedAt: now() };
  if (col === "projects" && SETTINGS_KEYS.some(k => k in data)) body.settingsAt = body.updatedAt;
  if (!S.live){ localApply(col, id, body, "update"); render(); return Promise.resolve(); }
  return optimisticWrite(col, id, "update", body, () => S.db.collection(col).doc(id).update(body));
}
function del(col, id){
  if (!S.live){ localApply(col, id, null, "delete"); render(); return Promise.resolve(); }
  return optimisticWrite(col, id, "delete", { updatedAt: now() }, () => S.db.collection(col).doc(id).delete());

function saveSettings(next){
  if (["globalAllowed","globalReadDirs","permissionMode"].some(k => k in next)) next = { ...next, settingsAt: now() };
  S.settings = { ...S.settings, ...next };

const markDone = (t, extra = {}) => patch("tasks", t.id, { status:"done", doneAt: now(), ...extra });

async function boot(){

    claude.use("db").catch(() => null), claude.use("mcp").catch(() => null), claude.use("sample").catch(() => null)
  ]);
  S.mcp = mcp; S.sample = sample;

/* All live subscriptions. connect() can run again to recover from an error without reloading the page.
   Query limits: the store accepts limit(1..1000). */
function connect(){
  const db = S.db; if (!db) return;
  for (const u of S.unsubs || []) try { u(); } catch {}
  for (const sub of Object.values(S.taskSubs || {})) try { sub.unsub?.(); } catch {}
  S.unsubs = []; S.taskSubs = {}; S.fullProjects = new Set(); S.dbError = null;
  let pending = 13;
  const done = () => { if (--pending === 0){ S.loaded = true; ensureWatch(); backfillBlockerKeys().catch(e => console.error("backfill", e)); } render(); };
  const fail = (name, first) => e => { console.error(name, e); if (first.v){ first.v = false; done(); } S.dbError = { name, code: e?.code || "error" }; render(); };
  /* Small collections load whole; growing ones load the most recent slice. Tasks are scoped: see subscribeTasks. */
  const sources = {
    projects: db.collection("projects"), pis: db.collection("pis"), sprints: db.collection("sprints"), ideas: db.collection("ideas"),
    opportunities: db.collection("opportunities"), duels: db.collection("duels"), bettingRounds: db.collection("bettingRounds").orderBy("at", "desc").limit(50),
    chunks: db.collection("chunks").orderBy("createdAt", "desc").limit(300),
    estimates: db.collection("estimates").orderBy("at", "desc").limit(1000),
    activity: db.collection("activity").orderBy("at", "desc").limit(20),
    actions: db.collection("actions").orderBy("at", "desc").limit(300),
  };
  for (const [col, q] of Object.entries(sources)){
    const first = { v: true };
    S.unsubs.push(q.onSnapshot(snap => {
      S._raw[col] = snap.docs.map(d => ({ ...d.data(), id:d.id })); S[col] = overlay(col, S._raw[col]);
      if (first.v){ first.v = false; done(); } else { render(); if (col === "chunks") applyHelper(); }
    }, fail(col, first)));
  }
  const firstAttn = { v: true };
  S.unsubs.push(db.collection("tasks").where("status", "in", ["running","review","paused","failed"]).onSnapshot(snap => {
    S.attnTasks = snap.docs.map(d => ({ ...d.data(), id:d.id })); rebuildTasks();
    if (firstAttn.v){ firstAttn.v = false; done(); } else { render(); applyHelper(); }
  }, fail("tasks needing attention", firstAttn)));
  S.unsubs.push(db.doc("insights/latest").onSnapshot(snap => { S.insights = snap.exists ? snap.data() : null; render(); }, () => {}));
  const firstS = { v: true };
  S.unsubs.push(db.doc("settings/main").onSnapshot(snap => {
    if (snap.exists) S.settings = { ...DEFAULTS, ...snap.data() };
    if (snap.exists && !(S.settings.permV >= 2)){
      if (S.settings.permissionMode === "auto") toast("Agents now run with an allow list instead of auto mode, so allowed commands stop being blocked. Change it in Settings.");

    }
    if (firstS.v){ firstS.v = false; done(); } else { ensureWatch(); render(); }
  }, () => { if (firstS.v){ firstS.v = false; done(); } }));

}

/* Tasks load per project: the one on screen in full (plus up to 4 recently viewed, kept warm), and across
   all projects only the ones that need attention. S.tasks is the merged view the rest of the page reads. */
const TASK_SUB_MAX = 5;
function subscribeTasks(pid0){
  // A parent project loads its own tasks and every subproject's in one query; the key changes if the family does.
  const ids = pid0 ? familyIds(pid0) : [], pid = ids.join(",");
  if (!S.db || !pid || S.taskSubs[pid]) { if (S.taskSubs[pid]) S.taskSubs[pid].at = now(); return; }
  const sub = { at: now(), docs: [], unsub: null, ids };
  S.taskSubs[pid] = sub;
  sub.unsub = S.db.collection("tasks").where("projectId", ids.length > 1 ? "in" : "==", ids.length > 1 ? ids : ids[0]).onSnapshot(snap => {
    sub.docs = snap.docs.map(d => ({ ...d.data(), id:d.id })); ids.forEach(i => S.fullProjects.add(i)); rebuildTasks(); render(); applyHelper(); ids.forEach(syncStats);
  }, e => { console.error("tasks", pid, e); S.dbError = { name: "project tasks", code: e?.code || "error" }; render(); });
  const keys = Object.keys(S.taskSubs);
  if (keys.length > TASK_SUB_MAX){
    const old = keys.filter(k => k !== pid && k !== S.projectId).sort((a,b) => S.taskSubs[a].at - S.taskSubs[b].at)[0];
    if (old){ S.taskSubs[old].unsub?.(); (S.taskSubs[old].ids || [old]).forEach(i => S.fullProjects.delete(i)); delete S.taskSubs[old]; rebuildTasks(); }
  }
}
function rebuildTasks(){
  const m = new Map();
  for (const t of S.attnTasks || []) m.set(t.id, t);
  for (const sub of Object.values(S.taskSubs)) for (const t of sub.docs) m.set(t.id, t);
  S.tasks = overlay("tasks", [...m.values()]);
}
/* Each project keeps small summary counts for the nav, written by whoever has that project open (debounced, only on change). */
const statsTimers = {};
function syncStats(pid){
  clearTimeout(statsTimers[pid]);
  statsTimers[pid] = setTimeout(() => {
    const p = proj(pid); if (!p || !S.fullProjects.has(pid)) return;
    const x = projStats(pid), st = { n: x.n, nDone: x.nDone, total: x.total, done: x.done, remainingAdj: Math.round(x.remainingAdj) };
    if (JSON.stringify(st) !== JSON.stringify(p.stats || {})) patch("projects", pid, { stats: st });
  }, 3000);
}
/* Nav numbers: live for loaded projects, stored summary for the rest. */
function navStats(pid){
  if (S.fullProjects.has(pid) || !S.live) return projStats(pid);
  const st = proj(pid)?.stats || {}, attn = S.tasks.filter(t => t.projectId === pid);
  return { n: st.n || 0, nDone: st.nDone || 0, total: st.total || 0, done: st.done || 0, remainingAdj: st.remainingAdj || 0,
    running: attn.filter(leaseLive).length, review: attn.filter(t => t.status === "review").length };
}

/* ---------- helper on your Mac ---------- */
async function host(cmd, timeout = 20000){
  if (!S.mcp) throw { code:"capability_disabled" };
  const res = await S.mcp.callTool(HOST, "start_process", { command: cmd, timeout_ms: timeout });
  return resultText(res);
}
function resultText(res){
  if (!res) return "";
  if (typeof res.payload === "string") return res.payload;
  if (res.payload && typeof res.payload === "object") return JSON.stringify(res.payload);
  return (res.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
}
const HELPER = '"$HOME/.ai-planner/runway.py"';
/* Watch the helper's status file. read_file is read-only, so it refreshes every minute without prompting. */
/* While a merge runs, read the status file every few seconds instead of once a minute (read_file never prompts). */
async function fastPoll(){
  if (S.fastPolling || !S.mcp || !S.settings.home) return; S.fastPolling = true;
  const until = now() + 15 * 60e3;
  try {
    const busy = () => S.tasks.some(t => t.run?.merging) || Object.values(S.helper?.merges || {}).some(b => b.state !== "done") || [...(S.landJobs || [])].some(id => S.helper?.merges?.[id]?.state !== "done");
    while (now() < until && busy()){
      await new Promise(r => setTimeout(r, 6000));
      try {
        const text = resultText(await S.mcp.callTool(HOST, "read_file", { path: S.settings.home + "/.ai-planner/status.json" }));
        const i = text.indexOf("{"), j = text.lastIndexOf("}");
        S.helper = JSON.parse(text.slice(i, j + 1)); S.helperState = "on"; S.helperAt = (S.helper.now || 0) * 1000;
        await applyMerges();
      } catch (e) { if (e?.code === "cancelled") break; }
    }
  } finally { S.fastPolling = false; }
}
function ensureWatch(){
  const home = S.settings.home;

  S.watchOff?.(); S.watchHome = home;
  S.watchOff = S.mcp.watchTool(HOST, "read_file", { path: home + "/.ai-planner/status.json" }, ev => {
    if (ev.type === "data"){
      const text = resultText(ev.result); const i = text.indexOf("{"), j = text.lastIndexOf("}");
      try {
        S.helper = JSON.parse(text.slice(i, j+1)); S.helperState = "on"; S.helperAt = (S.helper.now||0)*1000;
        // A tick's status can be older than what live.json already showed: keep the newer live chunks, so cards never step back.
        if (S.liveChunks && (S.liveAt || 0) > S.helperAt) S.helper.chunks = { ...(S.helper.chunks || {}), ...S.liveChunks };
        if (S.liveClaims && (S.liveAt || 0) > S.helperAt) S.helper.claims = S.liveClaims;
        applyHelper();
        if (S.tasks.some(t => t.status === "running")) livePoll();
      }
      catch { S.helperState = "error"; }
    } else {
      const c = ev.error?.code;
      S.helperState = c === "tool_error" ? "missing" : (c === "server_not_connected" || c === "capability_disabled" || c === "not_granted") ? "nohost" : "error";
      if (["needs_reauth","server_not_connected","not_in_manifest","blocked_by_policy","approval_required"].includes(c)) S.helper = null;
    }
    render();
  }, { refetchInterval: 60000 });
}
/* While any task is running, read ~/.ai-planner/live.json every LIVE_MS. run.sh rewrites it every few seconds with the
   running chunks only, so cards move from Starting to Running to Review within seconds instead of at the next tick. */
const LIVE_MS = 4000;
async function livePoll(){
  if (S.livePolling || !S.mcp || !S.settings.home) return; S.livePolling = true;
  try {
    let idle = 0;
    while (idle < 3){
      const busy = S.tasks.some(t => t.status === "running") || S.launching;
      idle = busy ? 0 : idle + 1;
      try {
        const text = resultText(await S.mcp.callTool(HOST, "read_file", { path: S.settings.home + "/.ai-planner/live.json" }));
        const i = text.indexOf("{"), j = text.lastIndexOf("}");
        const L = JSON.parse(text.slice(i, j + 1));
        if (L && L.chunks && (L.now || 0) * 1000 >= (S.liveAt || 0)){
          S.liveAt = (L.now || 0) * 1000;
          for (const c of Object.values(L.chunks)) c._at = S.liveAt;
          S.liveChunks = L.chunks;
          if (Array.isArray(L.claims)) S.liveClaims = L.claims;
          S.helper = { ...(S.helper || {}), chunks: { ...((S.helper || {}).chunks || {}), ...L.chunks }, ...(Array.isArray(L.claims) ? { claims: L.claims } : {}) };
          if (S.helperState !== "on"){ S.helperState = "on"; S.helperAt = S.liveAt; }
          await applyHelper(); softRender();
        }
      } catch {} // no live.json yet (older helper, nothing launched): the minute watch still covers it
      await new Promise(r => setTimeout(r, LIVE_MS));
    }
  } finally { S.livePolling = false; }
}
async function installHelper(){

  toast("Installing the helper on your Mac…");

    const home = (out.match(/@@HOME (.+)/) || [])[1]?.trim();
    if (!out.includes("@@VERSION") || !home) throw { code:"tool_error", message: out.slice(-300) };
    S.watchHome = null; saveSettings({ home });

function hostErrCopy(e){
  const c = e && e.code;
  if (c === "server_not_connected" || c === "capability_disabled") return "Your Mac isn't reachable from this view. Open Runway in the Claude desktop app with Desktop Commander connected.";
  if (c === "not_in_manifest") return "Access to your Mac is turned off for this page. Turn it on in the page's Permissions menu.";

/* Fold the helper's view of each run into the board. Writes only on real transitions. */
async function applyHelper(){
  if (!helperOn() || !S.live) return;
  if (S.applying && now() - S.applying < 45000){ applyMerges(); return; } // a write that never settles must not stop updates for good
  S.applying = now();
  try {
    await applyClaims();
    const H = S.helper.chunks || {};
    for (const c of S.chunks){
      // A chunk marked complete while some of its tasks still read "running" (they weren't loaded at the time) is reopened.
      if (c.status === "complete" && !(c.taskIds || []).some(id => task(id)?.status === "running" && task(id)?.run?.chunkId === c.id)) continue;
      const d = H[c.id]; if (!d || !d.exists) continue;
      const states = []; let changed = false;
      for (const tid of c.taskIds || []){
        const t = task(tid), r = d.tasks[tid];
        if (!t){ states.push("pending"); continue; } // not loaded yet: never count it as finished
        if (t.run?.chunkId !== c.id){ states.push("gone"); continue; }
        if (!r){ states.push("pending"); continue; } // run.sh has not written its status files yet
        states.push(r.state);

        // The helper's reaper ended a run whose process died (JOBS-CONTRACT.md): back to the queue, or Needs you after 2.
        if (r.state === "reaped" && t.status === "running"){
          const tm = r.terminal || {}, again = tm.state === "requeued";
          await patch("tasks", tid, { status: again ? "todo" : "failed", ...(again ? { finishedAt: null } : { finishedAt: now() }),
            run: { ...t.run, terminal: tm, err: again ? `Re-queued: ${tm.reason || "its run died"} (next is attempt ${tm.nextAttempt || 2}).` : (tm.ask || tm.reason || "Its run died twice.") } });
          changed = true; continue;
        }
        if (r.state !== "done" || t.status !== "running") continue;
        const agent = Math.round(effTokens(r.usage));

    put("activity", "ap" + Date.now().toString(36), { kind:"approve", state:"done", at: now(), items: inPlace.map(t => ({ id: t.id, title: t.title, outcome:"done", msg:"Already in your checkout" })) });
    toast(`${inPlace.length} approved and moved to Done.`);
    ids = ids.filter(id => !inPlace.some(t => t.id === id)); S.msel = null;
    if (!ids.length){ render(); return; }
  }
  ids = ids.filter(id => !S.mergingIds.has(id) && !task(id)?.run?.merging); // a second click while one runs does nothing
  if (!ids.length){ toast("Already merging."); return; }
  ids.forEach(id => S.mergingIds.add(id)); setTimeout(() => ids.forEach(id => S.mergingIds.delete(id)), 20000); render();
  const ts = ids.map(task).filter(Boolean).sort(globalOrder);
  const ordered = []; const left = [...ts];
  while (left.length){ const i = left.findIndex(t => !(t.deps||[]).some(d => left.some(x => x.id === d))); ordered.push(left.splice(i < 0 ? 0 : i, 1)[0]); }
  const bid = "mb" + Date.now().toString(36);
  const spec = { resolve: true, items: ordered.map(t => ({ ch: t.run.chunkId, tid: t.id, title: t.title, ...(opts.force ? { force: true } : {}) })) };
  try {
    const out = await host(`python3 ${HELPER} merge-batch ${bid} ${sq(b64(JSON.stringify(spec)))}`, 15000);
    if (!out.includes("@@MERGING")) throw { code:"tool_error", message: out.slice(-200) };
    put("activity", bid, { kind:"merge", state:"running", at: now(), items: ordered.map(t => ({ id: t.id, title: t.title, base: t.run?.base || "", outcome:"queued" })) });
    for (const t of ordered) await patch("tasks", t.id, { run:{ ...t.run, mergeBatch: bid, merging: true, err: "" } });
    S.msel = null; toast(`Merging ${ordered.length} task${ordered.length > 1 ? "s" : ""}… They move to Done as each one lands on the branch.`);
    fastPoll();
  } catch (e) { if (e.code !== "cancelled") toast(hostErrCopy(e)); }
  render();
}

/* ---------- hands-off policies (Settings > Hands-off) ----------

   auto-land), acts once per occurrence (its actions row id is derived from the task and run, and is claimed before the
   action starts), writes one row to `actions`, and leaves the Inbox alone. What a policy gives up on stays in the Inbox

const HO = { merge:"handsOffMerge", retry:"handsOffRetry", budget:"handsOffBudget", done:"handsOffDone", close:"handsOffClose", land:"handsOffLand" };

/* Why a run stopped, as run_signals categorised it. Older paused runs have no category: their message says which. */
function runCategory(t){

  return t.status === "paused" ? (/budget guard/i.test(r.err || "") ? "budget" : "limit") : null;
}
const hoMergeId = t => `am-${t.id}-${t.run?.chunkId}`, hoRetryId = (t, n) => `ar-${t.id}-${t.run?.chunkId}-${n}`, hoBudgetId = t => `ab-${t.id}-${t.run?.chunkId}`;

async function logAction(id, t, kind, detail, undo, extra = {}){
  (S.hoClaimed ||= new Set()).add(id);
  await put("actions", id, { at: now(), taskId: t?.id || null, projectId: t?.projectId || null, kind, detail, ...(undo ? { undo } : {}), ...extra });
}

/* 1. Auto-merge: green, verified, finished by the agent, no blockers, something changed, no conflict. */
function autoMergeOk(t){
  const r = t.run || {}, v = r.verify;
  if (!hoOn("merge") || proj(t.projectId)?.autoMerge === false || !helperOn()) return false;
  if (t.status !== "review" || !r.wt || !r.chunkId || r.merging || S.mergingIds.has(t.id) || !hoRecent(t) || hoClaimed(hoMergeId(t))) return false;
  if (!(r.files > 0) || r.agentStatus !== "done" || (r.outcome?.blockers || []).length || isBlocked(t)) return false;
  if (["red", "timeout"].includes(r.checksState) || ["error", "conflict", "checks", "empty"].includes(r.mergeOutcome)) return false;
  return S.settings.verify ? v?.pass === true : (v?.pass !== false && !v?.unverifiable);
}
async function policyMerge(){
  const ts = S.tasks.filter(autoMergeOk); if (!ts.length) return;
  for (const t of ts) (S.hoClaimed ||= new Set()).add(hoMergeId(t));

}

/* 2. Infrastructure retries: sign-in, usage limit and setup failures relaunch themselves once the cause clears. */
function retryState(t){
  if (!hoOn("retry") || !t.run?.chunkId || !hoRecent(t)) return null;
  const cat = runCategory(t); if (!INFRA[cat] || !(t.status === "failed" || (t.status === "paused" && cat === "limit"))) return null;
  const used = t.autoRetries || 0, cap = cat === "setup" ? 1 : 2;
  return used < cap ? { cat, label: INFRA[cat], used, cap } : { cat, label: INFRA[cat], used, cap, gaveUp: `Runway retried this ${used} time${used > 1 ? "s" : ""} automatically and it still stopped on ${INFRA[cat]}.` };
}
const waitingRetry = t => { const s = retryState(t); return s && !s.gaveUp && !hoClaimed(hoRetryId(t, s.used)) ? s : null; };
function retryDue(t, s){
  if (s.cat === "setup") return now() - (t.finishedAt || 0) >= HO_SETUP_WAIT;
  if (s.cat === "limit"){ // the usage window has reset since it stopped (or, with no reset time known, five hours have passed)
    const reset = windowReset() || windowUsage().reset; return reset ? reset - 5 * 3600e3 >= (t.finishedAt || 0) : now() - (t.finishedAt || 0) >= 5 * 3600e3;
  }

}
async function authCleared(){
  if (!S.tasks.some(t => waitingRetry(t)?.cat === "auth")) return false;
  if (now() - (S.authAt || 0) >= HO_AUTH_POLL){
    S.authAt = now(); S.authOk = false;
    try { const m = (await host(`python3 ${HELPER} auth-check`, 60000)).match(/@@AUTH (.*)/); S.authOk = !!(m && JSON.parse(m[1]).ok); } catch {}
  }
  return !!S.authOk;
}
async function policyRetry(){
  if (S.launching) return;
  await authCleared();
  const due = S.tasks.map(t => [t, waitingRetry(t)]).filter(([t, s]) => s && !launchGate(t) && retryDue(t, s));
  if (!due.length) return;
  for (const [t, s] of due){
    (S.hoClaimed ||= new Set()).add(hoRetryId(t, s.used));
    await logAction(hoRetryId(t, s.used), t, "retry", `Relaunched "${t.title}" after the ${s.label} problem cleared (automatic retry ${s.used + 1} of ${s.cap}).`);
    await patch("tasks", t.id, { autoRetries: s.used + 1 });
  }
  if (due.some(([, s]) => s.cat === "auth")) S.authOk = false; // the next failure asks again
  const byProject = {}; for (const [t] of due) (byProject[t.projectId] ||= []).push(task(t.id));
  for (const ts of Object.values(byProject)) await launchNow(ts.filter(Boolean));
}

/* 3. Budget stop: one automatic resume with the cap doubled, if the week has room. */
function budgetState(t){
  if (!hoOn("budget") || t.status !== "paused" || runCategory(t) !== "budget" || !hoRecent(t)) return null;
  if ((t.budgetResumes || 0) >= 1) return { gaveUp: `It hit its budget guard again after Runway resumed it once with the cap doubled (to $${guardUsd(t).toFixed(2)}).` };
  if (hoClaimed(hoBudgetId(t))) return null;
  return weekBudget() - weekUsage() >= adjT(t) ? { ok: true } : { gaveUp: `Stopped at its budget guard, and this week's budget has no room to resume it (${fmt(Math.max(0, weekBudget() - weekUsage()))} left).` };
}

    await patch("tasks", t.id, { budgetResumes: (t.budgetResumes || 0) + 1, guardX: (t.guardX || 1) * 2 });
  }

/* 6. Blockers (launch gate 3): a task whose last run ended blocked can't launch until what blocked it has changed.
   dependency: the named task is done/dropped, or the named branch has a commit newer than blockedAt. access: the path
   is readable now, or the project's folders changed. environment/permission: its check command now succeeds (the helper
   only ever runs plain read-only checks), or the project's/global settings changed since blockedAt. decision: answered
   in the blocker form. Austin can always press "Try again anyway". Resolved: the key clears, and with the retry
   policy on the task relaunches once. */
const bkDep = (t, b) => !b.needs ? null : S.tasks.find(x => x.id !== t.id && x.id === b.needs.trim())
  || S.tasks.find(x => x.id !== t.id && x.projectId === t.projectId && x.title.toLowerCase() === b.needs.toLowerCase())
  || S.tasks.find(x => x.id !== t.id && x.projectId === t.projectId && x.title.toLowerCase().includes(b.needs.toLowerCase().slice(0, 30)));
const settingsChangedSince = t => (proj(t.projectId)?.settingsAt || 0) > (t.blockedAt || 0) || (S.settings.settingsAt || 0) > (t.blockedAt || 0);
/* One verdict per blocker: true, false, or the id of a helper check to wait for (pushed on `items`). ctx is what the
   blocker form just did: answered decisions, a picked dependency or start branch, settings it changed. */
function bkVerdicts(t, items, ctx = {}){
  const p = proj(t.projectId), chg = !!ctx.settings || settingsChangedSince(t);
  return (blockedOutcome(t)?.blockers || []).map((b, i) => {
    const id = `${t.id}:${i}`;
    if (b.type === "decision") return !!ctx.answered?.has(i) || (t.blockerAnswered || []).includes(i);
    if (b.type === "dependency"){
      const dep = bkDep(t, b);
      if (dep) return dep.status === "done" || dep.status === "dropped" || !!ctx.deps?.includes(dep.id);
      if (ctx.base) return true;
      if (b.needs && isBranchName(b.needs.trim()) && p?.repo){ items.push({ id, branch: b.needs.trim(), since: t.blockedAt || 0, repo: p.repo }); return id; }
      return false;
    }
    if (chg && (b.type === "permission" || b.type === "environment" || b.type === "access")) return true;
    if (b.type === "access" && b.path){ items.push({ id, path: b.path }); return id; }
    if ((b.type === "environment" || b.type === "permission") && b.command){ items.push({ id, command: b.command, repo: p?.repo || "" }); return id; }
    return false;
  });
}
async function bkHelper(items){
  if (!items.length || !helperOn() || S.helper.v < 57) return {};
  try { const m = (await host(`python3 ${HELPER} blocker-check ${sq(b64(JSON.stringify(items)))}`, 90000)).match(/@@BLOCKERS (.*)/); return m ? JSON.parse(m[1]) : {}; } catch { return {}; }
}
const bkDone = (vs, got) => vs.every(v => typeof v === "string" ? !!got[v] : v);
/* The blocked tasks whose blockers have all cleared. */
async function checkBlockers(){
  const ts = S.tasks.filter(t => t.blockerKey && blockedOutcome(t) && !["running", "done", "dropped"].includes(t.status));
  if (!ts.length) return [];
  const items = [], rows = ts.map(t => [t, bkVerdicts(t, items)]), got = await bkHelper(items);

}
const BK_CLEAR = { blockerKey: null, blockerDetail: null };
async function clearBlocker(t, how, extra = {}){
  const id = `bk-${t.id}-${t.blockedAt || 0}-${how}`;
  await patch("tasks", t.id, { ...BK_CLEAR, blockerClearedAt: now(), ...extra });
  await logAction(id, t, "retry", how === "forced" ? `Austin pressed "Try again anyway" on "${t.title}": the blocker (${t.blockerDetail || "unchanged"}) was not resolved.` : `The blocker on "${t.title}" is resolved (${t.blockerDetail || "what it waited on"}).`);
}
async function policyUnblock(){
  if (S.launching || now() - (S.bkAt || 0) < 45e3 || !S.tasks.some(t => t.blockerKey)) return;
  S.bkAt = now();
  for (const t of await checkBlockers()){
    const relaunch = hoOn("retry") && t.unblockRetried !== t.blockedAt && ["review", "failed", "paused", "todo"].includes(t.status);
    await clearBlocker(t, "resolved", relaunch ? { unblockRetried: t.blockedAt } : {});
    if (!relaunch) continue;
    const r = { ...t.run, blockerHandled: true, diagnosis: null }, canResume = !!r.session;
    await patch("tasks", t.id, { status: canResume ? "paused" : "todo", resumePrompt: canResume ? `The thing that blocked you is resolved (${t.blockerDetail || "see the blocker"}). Continue the task, commit to your branch and end with your report.${OUTCOME_REMIND}` : null, run: canResume ? r : { ...r, session: null } });
    await launchNow([task(t.id)].filter(Boolean));

}
/* ---------- needs-you steps ----------

   labelled needs_you, and by hand in the task drawer. `check` is an optional read-only shell command the helper runs in
   the repo (needs-check) to prove the step is done. The launch gate (needsYouGate) keeps the task off every launch path. */

  return [...by].map(([pid, ts]) => [proj(pid)?.name || "Project", ts.sort(byOrder)]);
};
const needsYouCount = () => S.tasks.reduce((n, t) => n + (["done", "dropped"].includes(t.status) ? 0 : openSteps(t).length), 0);
// A step is done. The last open step on a task clears its blocker, finishes a human task, and (hands-off retry on) launches it once.

}
async function checkStep(t, s){
  if (!helperOn() || S.helper.v < 58){ toast("Update the helper to run checks."); return; }
  try {
    const out = await host(`python3 ${HELPER} needs-check ${sq(b64(JSON.stringify([{ id: s.id, check: s.check, repo: proj(t.projectId)?.repo || "" }])))}`, 40000);

const GHL_STEPS = [

  if (!ts.length) return;

  if (t.status === "review" && t.leadNote && t.leadNote.chunkId === r.chunkId) return `The AI lead declined this decision and left it for you: ${t.leadNote.why}.`;
