/* Everything that needs a decision, newest first. */
function inboxItems(){
  const items = [];
  for (const x of (helperOn() && S.helper.integrations || []).filter(x => x.ahead > 0 && !autoLandOk(x) && !landInFlight(x)))
    items.push({ kind:"land", key:"land:" + x.repo + ":" + x.base, x, at: S.helperAt, why: hoOn("land") && hoClaimed(hoLandId(x)) ? S.actions.find(a => a.id === hoLandId(x))?.detail || "" : "" });
  for (const t of S.tasks){
    if (t.status === "parked") continue; // deferred on purpose: never an Inbox item
    if (openSteps(t).length || t.kind === "human") continue; // waiting on Austin's own steps: the Needs you list, not one card per task
    if (t.run?.merging || S.mergingIds?.has(t.id)) continue; // shown as "Merging…" in the Activity panel instead
    if (hoHandling(t)) continue; // a hands-off policy is acting on it (Settings > Hands-off); it is logged under Runs > Activity
    const why = giveUpWhy(t);
    if (t.status === "review" && isBlocked(t)) items.push({ kind:"blocked", key:t.id, t, at: t.finishedAt || 0, why });
    else if (t.status === "review") items.push({ kind: t.run?.files === 0 || (t.run?.files == null && t.run?.mergeOutcome === "empty" && t.run?.mergeApplied) ? "empty" : "review", key:t.id, t, at: t.finishedAt || 0, why });
    else if (t.status === "paused") items.push({ kind:"paused", key:t.id, t, at: t.finishedAt || 0, why });
    else if (t.status === "failed" && t.run?.chunkId) items.push({ kind:"failed", key:t.id, t, at: t.finishedAt || 0, why });
  }
  for (const c of S.chunks) if (c.status === "unknown" || c.status === "script") items.push({ kind:"launch", key:"chunk:" + c.id, c, at: c.createdAt || 0 });
  for (const sp of S.sprints) if (sprintReady(sp) && !sprintAutoClose(sp)) items.push({ kind:"close", key:"close:" + sp.id, sp, at: Math.max(0, ...tasksOf(sp.id).map(t => t.doneAt || t.finishedAt || 0)) });
  for (const pi of S.pis) if (piNeedsReview(pi)) items.push({ kind:"pireview", key:"pi:" + pi.id, pi, at: Math.max(0, ...sprintsOf(pi.id).map(x => x.closedAt || 0)) });
  // Off by default (settings.bettingOn): once a week, if there's anything to bet on.
  if (S.settings.bettingOn){
    const last = lastBettingRound(), due = !last || now() - last.at >= 7 * 86400e3;
    if (due && bettingCandidates(null).length) items.push({ kind:"betting", key:"betting", at: last?.at || 0 });

  return items.sort((a,b) => rank[a.kind] - rank[b.kind] || b.at - a.at);
}

/* ---------- ideas: explore → compare → decide → hand off ---------- */
const IDEA_KINDS = { build:"Build", experiment:"Experiment", offer:"Offer", decision:"Decision" };
/* Appetite (Shape Up): what an idea is worth, set before it's shaped. Base ranges are a guess at the shape of each

   Austin's own time and aren't part of that bias. */
const APPETITE_LEVELS = { test:"Quick test", sprint:"Sprint", pi:"PI" };
const APPETITE_BASE = { test:[40000, 150000, 0, 2], sprint:[250000, 900000, 2, 10], pi:[1200000, 4000000, 8, 40] };
function appetiteRange(level){
  const b = APPETITE_BASE[level]; if (!b) return null;
  const f = calibration().factor;
  return { tokLo: Math.round(b[0] * f), tokHi: Math.round(b[1] * f), hrsLo: b[2], hrsHi: b[3] };
}
function appetiteLabel(level){
  const r = appetiteRange(level); if (!r) return "";
  const usd = n => money(n * costPerTok("sonnet"));
  return `${fmt(r.tokLo)}–${fmt(r.tokHi)} agent tokens · ${usd(r.tokLo)}–${usd(r.tokHi)} · ${r.hrsLo}–${r.hrsHi} h of you`;

const IDEA_OPEN = ["new","exploring","explored"];
const ideaOpen = i => IDEA_OPEN.includes(i.status || "new");

const ideaShape = i => (i.shapes || [])[i.chosen ?? i.recommend ?? 0] || null;

function ideaScore(i){
  const sh = ideaShape(i); if (!sh) return null;
  const w = { impact:.4, confidence:.2, cost:.2, speed:.2, ...(S.settings.ideaWeights || {}) };
  const tot = w.impact + w.confidence + w.cost + w.speed || 1;
  const impact = (i.impact ?? sh.impact ?? 3) / 5, conf = (i.confidence ?? sh.confidence ?? 3) / 5;

/* ---------- assumption map (Bland): importance x evidence, test the riskiest first (PI 7 Sprint 2) ---------- */
const AS_TYPES = { desirable:"Desirable", viable:"Viable", feasible:"Feasible" };
/* Chip position on the grid: evidence (0 weak .. 3 strong) along x, importance (1 low .. 5 high) along y, high at the top. */
function asPos(a){
  const imp = Math.max(1, Math.min(5, a.importance ?? 3)), ev = Math.max(0, Math.min(3, a.evidence ?? 0));
  return { left: (ev / 3) * 100, top: (1 - (imp - 1) / 4) * 100 };
}
/* The riskiest assumption: most important, least evidence. */
function riskiestAssumption(i){
  const list = i.assumptions || []; if (!list.length) return null;
  return [...list].sort((a,b) => (b.importance ?? 0) - (a.importance ?? 0) || (a.evidence ?? 0) - (b.evidence ?? 0) || String(a.id).localeCompare(String(b.id)))[0];
}
/* Derived, not stored: true the moment a broken assumption important enough to matter exists, false again if its
   evidence or importance later changes — so it never drifts from what the data actually says. */
const ideaFlagged = i => (i.assumptions || []).some(a => a.resolution === "broke" && (a.importance ?? 3) >= 4);
async function patchAssumption(ideaId, asId, fields){
  const i = S.ideas.find(x => x.id === ideaId); if (!i || !(i.assumptions || []).some(x => x.id === asId)) return;
  const assumptions = i.assumptions.map(x => x.id === asId ? { ...x, ...fields } : x);
  await patch("ideas", ideaId, { assumptions }); S._ovSig = null; render();
}
async function moveAssumptionTo(ideaId, asId, importance, evidence){
  const i = S.ideas.find(x => x.id === ideaId); const a = (i?.assumptions || []).find(x => x.id === asId); if (!i || !a) return;
  importance = Math.max(1, Math.min(5, importance)); evidence = Math.max(0, Math.min(3, evidence));
  if (a.importance === importance && a.evidence === evidence) return;
  await patchAssumption(ideaId, asId, { importance, evidence });
}
async function addAssumption(ideaId){
  const i = S.ideas.find(x => x.id === ideaId); if (!i) return;
  const a = { id: uid("as"), statement:"", type:"desirable", importance:3, evidence:0, test:"", taskId:null, resolution:null };
  await patch("ideas", ideaId, { assumptions: [...(i.assumptions || []), a] }); S._ovSig = null; render();

async function delAssumption(ideaId, asId){

/* Where a test task for an assumption lands: the idea project's latest open sprint, or a small "Assumption tests" PI
   and sprint created on first use if the project has none yet. Never touches launch, merge or land behaviour. */
async function sprintForAssumptionTest(pid){
  const p = proj(pid); if (!p) return null;
  const openPis = pisOf(pid).filter(x => x.status !== "closed").sort(byOrder);
  const pi = openPis[openPis.length - 1] || pisOf(pid).sort(byOrder).slice(-1)[0];
  if (pi){ const sprints = sprintsOf(pi.id); if (sprints.length) return sprints[sprints.length - 1]; }
  const piId = uid("pi");
  await put("pis", piId, { projectId:pid, name:"Assumption tests", objective:"Test the riskiest assumptions from Ideas", order: pisOf(pid).reduce((m,x) => Math.max(m, x.order||0), 0) + 1, createdAt: now() });
  const spId = uid("s");
  await put("sprints", spId, { projectId:pid, piId, name:"Assumption tests", goal:"Cheap tests for risky assumptions", order:1 });
  return S.sprints.find(s => s.id === spId);
}

  S.riffing.delete(id); render();
}
/* Opens the planner on this idea's project (extending it, so the next PI picks up where it left off) or a fresh one;
   shared by the drawer's Promote button and the betting table's Bet. notesLines go into the plan's context verbatim. */
function openPromotePlanner(i, notesLines){
  const p = proj(i.projectId), sh = ideaShape(i);
  S.overlay = { kind:"planner", extend: !!p, projectId: p?.id, phase:"form",
    form: { name: p?.name || i.title, goal: p?.goal || (sh?.summary || i.title), repo: p?.repo || "", pis: 1,

async function ideaOutcome(){

/* Confirmed decisions go to the vault as the member's own (confidence: confirmed-with-austin). */
async function logDecision(i, sh, why){
  const today = isoDay(now()), d = new Date();
  const md = `## ${today} · ${i.title}\n- **Decision:** ${sh?.name || ""}${sh?.summary ? ` — ${sh.summary}` : ""}\n- **Why:** ${why || "(no reason given)"}${sh?.risk ? `\n- **Watch for:** ${sh.risk}` : ""}${i.killCase ? `\n- **Case against, considered:** ${i.killCase}` : ""}\n- **Source:** Runway Ideas`;
  const req = { vault: S.settings.vaultPath, path: "_Claude/Strategies/decision-log.md", log: "_Claude/log.md", today, append: true,
    header: `---\ntags: [strategy, decisions]\ncreated: __CREATED__\nupdated: ${today}\nstatus: active\nwiki: main\nconfidence: confirmed-with-austin\n---\n\n# Decision log\n\nDecisions Austin confirmed in Runway Ideas, newest last. Each entry is his call, not an AI draft.\n`,
    markdown: md, logLine: `${today} ${pad(d.getHours())}:${pad(d.getMinutes())} | capture | Decision: ${i.title} → ${sh?.name || ""} | Strategies/decision-log.md` };
  const r = await hostAction(`python3 ${HELPER} export ${sq(b64(JSON.stringify(req)))}`, "Logged to the vault.");

/* ---------- betting table (Shape Up): a short, regular decision inside a fixed budget, so the backlog never just
   grows (PI 7 Sprint 3). A sitting is held in S.betting (not the overlay, so closing and reopening the modal keeps
   the same running total); closing it for the week writes one bettingRounds record and settles misses and fades. */
/* Candidates: each opportunity's top duel winners that carry an appetite, best rating first. Loose ideas (no
   opportunity yet) and ideas with no appetite never reach the table. */
function bettingCandidates(scope){
  return oppsInScope(scope).map(o => ({ o, ideas: S.ideas.filter(i => ideaOpen(i) && i.opportunityId === o.id && i.appetite)
    .sort((a,b) => ideaRating(b) - ideaRating(a)).slice(0, 3) })).filter(x => x.ideas.length);
}
/* What betting on this idea would commit: the midpoint of its appetite range. */
function betCost(i){
  const r = appetiteRange(i.appetite); if (!r) return { tok:0, hrs:0 };
  return { tok: Math.round((r.tokLo + r.tokHi) / 2), hrs: (r.hrsLo + r.hrsHi) / 2 };
}
/* The agent-token budget for the next PI: whatever capacity today's window and this week's budget still have left,
   so it tracks the same settings as the usage gauges without a budget number of its own. */
function bettingTokenBudget(){ return Math.max(0, winBudget() - windowUsage().used) + Math.max(0, weekBudget() - weekUsage()); }
const bettingHoursBudget = () => S.settings.bettingHours || 0;
/* Derived, not stored: true the moment an open idea has gone two betting tables unbet, or sat untouched for the
   fade setting's weeks — whichever comes first. Shown as a dimmed "Fading" card wherever ideas are listed. */
function ideaFading(i){
  if (!ideaOpen(i)) return false;
  const weeks = S.settings.ideaFadeWeeks || 4;
  return (i.tableMisses||0) >= 2 || now() - (i.updatedAt || i.createdAt || 0) >= weeks * 7 * 86400e3;
}
const lastBettingRound = () => [...S.bettingRounds].sort((a,b) => (b.at||0) - (a.at||0))[0] || null;
function openBettingTable(){
  const scope = S.ideaProject || "__all";
  if (!S.betting || S.betting.scope !== scope) S.betting = { scope, bets:[], parks:[], fades:[] };
  S.overlay = { kind:"betting" }; render();
}
/* Bet: a one-sentence why-now and an expected signal with a date (read later by the decision journal), then the
   same promote flow as the drawer's Promote button, into whichever PI the project plans next. */
async function confirmBet(){
  const o = S.overlay, i = S.ideas.find(x => x.id === o?.betOn); if (!i) return;
  const whyNow = $("#bet-why")?.value.trim() || "", signal = $("#bet-signal")?.value.trim() || "", byVal = $("#bet-by")?.value;
  if (!whyNow || !signal || !byVal){ o.betError = "Give a why-now, an expected signal, and a date."; render(); return; }
  const signalBy = new Date(byVal).getTime();
  S.betting.bets.push({ id: i.id, title: i.title });
  S.pendingIdea = { id: i.id, why: whyNow, signal, signalBy, appetite: i.appetite || null, rank: rankAtDecision(i), pick: pickInfo(i) };
  openPromotePlanner(i, [`Why now: ${whyNow}`, `Expected signal by ${day(signalBy)}: ${signal}`]);
  render();
}
async function parkFromBetting(id){
  const i = S.ideas.find(x => x.id === id); if (!i || !S.betting) return;
  await patch("ideas", id, { status:"parked", decision: { outcome:"parked", choice:"", reason:"Parked from the betting table.", at: now(), revisitAt: null } });
  S.betting.parks.push({ id, title: i.title }); render();
}
async function fadeFromBetting(id){
  const i = S.ideas.find(x => x.id === id); if (!i || !S.betting) return;
  await patch("ideas", id, { status:"faded", fadedAt: now() });
  S.betting.fades.push({ id, title: i.title }); render();
}
/* Closing the table for the week: everyone who was a candidate and got no action this sitting (bet, parked or
   explicitly faded already removed them from ideaOpen, so bettingCandidates only returns who's left) either picks
   up a miss, or — if already fading — actually moves to the Faded section now. Then the round records itself. */
async function closeBettingRound(){
  const b = S.betting; if (!b) return;
  const autoFaded = [];
  for (const { ideas } of bettingCandidates(b.scope)) for (const i of ideas){
    if (ideaFading(i)){ await patch("ideas", i.id, { status:"faded", fadedAt: now() }); autoFaded.push({ id:i.id, title:i.title }); }
    else await patch("ideas", i.id, { tableMisses: (i.tableMisses||0) + 1 });
  }
  await put("bettingRounds", uid("bt"), { at: now(), scope: b.scope, bets: b.bets, parks: b.parks, fades: [...b.fades, ...autoFaded] });
  S.betting = null; S.overlay = null; render();
  toast("Betting table recorded for this week.");
}
function bettingCard(i, fading, isForm){

/* ---------- decision journal: was each bet worth it? (PI 7 Sprint 3) ---------- */
/* Every idea with a decision recorded — bet, decide, park or kill — is one journal entry, newest first. Faded ideas
   never had a decision made on them and don't appear here. */
function journalEntries(scope){ return S.ideas.filter(i => i.decision && ideaInScope(i, scope)).sort((a,b) => (b.decision.at||0) - (a.decision.at||0)); }
/* The tasks a bet's own PI created: every task under the PI the planner opened when it was promoted. */
function betTasks(d){ return d && d.piId ? S.tasks.filter(t => t.piId === d.piId) : []; }
function betDone(d){ const ts = betTasks(d); return ts.length > 0 && ts.every(t => t.status === "done" || t.status === "dropped"); }
/* Ready for its check-in: a bet (the only outcome with an expected signal) not already answered, once either its
   tasks are all in or its signal date has passed — whichever comes first. */
function needsCheckIn(i){
  const d = i.decision; if (!d || d.outcome !== "promoted" || !d.signalBy || d.checkIn) return false;
  return betDone(d) || now() >= d.signalBy;
}
/* What a bet actually cost, read from the tasks its PI created and the run rows (Run health's own S.estimates)
   behind them: effective tokens, dollars, how many runs it took, and a tally of why those runs ended. */
function betActuals(d){
  const ts = betTasks(d), ids = new Set(ts.map(t => t.id)), rows = S.estimates.filter(r => ids.has(r.taskId));
  const cats = {}; for (const r of rows) cats[r.category || "ok"] = (cats[r.category || "ok"] || 0) + 1;
  return { tokens: ts.reduce((a,t) => a + (t.actualTokens||0) + (t.verifyTokens||0) + (t.resolveTokens||0), 0),
    cost: ts.reduce((a,t) => a + (t.costUsd||0), 0), runs: rows.length, tasks: ts.length, cats };
}
/* Answering a check-in freezes the actual cost into the decision so the entry never drifts later, even once
   S.estimates ages out of its own 1000-row window. */
async function answerCheckIn(id, verdict, note, hours){
  const i = S.ideas.find(x => x.id === id); if (!i || !i.decision) return;
  const checkIn = { verdict, note: note || "", hours: hours === "" || hours == null ? null : +hours, at: now(), actual: betActuals(i.decision) };
  await patch("ideas", id, { decision: { ...i.decision, checkIn } });
  toast("Check-in recorded.");
}
const JOURNAL_OUTCOME = { promoted:["Bet","act"], decided:["Decided","pass"], parked:["Parked",""], killed:["Killed","fail"] };
const JOURNAL_VERDICT = { yes:"Yes", partly:"Partly", no:"No" };
/* Hit rate: the share of answered entries whose verdict was a plain "yes". */
function hitRate(list){ return list.length ? Math.round(list.filter(i => i.decision.checkIn.verdict === "yes").length / list.length * 100) : null; }
/* Once there are 5+ answered bets, a one-line read on judgment so far: hit rate overall, by appetite size, by duel
   rank (top 3 vs the rest), and whether following Claude's pick did any better than overriding it. */
function calibrationLine(scope){
  const answered = journalEntries(scope).filter(i => i.decision.checkIn);
  if (answered.length < 5) return "";
  const parts = [`${answered.length} answered bet${answered.length === 1 ? "" : "s"}: ${hitRate(answered)}% yes`];
  const byAppetite = Object.keys(APPETITE_LEVELS).map(k => [k, answered.filter(i => i.decision.appetite === k)]).filter(([,l]) => l.length);
  if (byAppetite.length > 1) parts.push("by appetite — " + byAppetite.map(([k,l]) => `${APPETITE_LEVELS[k]} ${hitRate(l)}%`).join(", "));
  const top3 = answered.filter(i => i.decision.rank != null && i.decision.rank <= 3), rest = answered.filter(i => i.decision.rank == null || i.decision.rank > 3);
  if (top3.length && rest.length) parts.push(`top 3 duel rank ${hitRate(top3)}% vs the rest ${hitRate(rest)}%`);
  const followed = answered.filter(i => i.decision.pick?.followed), notFollowed = answered.filter(i => i.decision.pick && !i.decision.pick.followed);
  if (followed.length && notFollowed.length) parts.push(`Claude's pick followed ${hitRate(followed)}% vs overridden ${hitRate(notFollowed)}%`);
  return parts.join(" · ");
}
function checkInForm(i, d){
  const a = betActuals(d), cats = Object.entries(a.cats).map(([k,n]) => `${catName(k)} ${n}`).join(", ");
  return `<div class="note act" style="margin-top:8px">
    <div class="faint" style="font-size:12px">So far: ${fmt(a.tokens)} tok · ${money(a.cost)} · ${a.runs} run${a.runs === 1 ? "" : "s"} across ${a.tasks} task${a.tasks === 1 ? "" : "s"}${cats ? " · " + esc(cats) : ""}</div>
    <p style="margin:6px 0 4px">Did it move what you expected?</p>
    <input type="text" id="ci-note-${esc(i.id)}" placeholder="One line…" style="margin-bottom:6px">
    <input type="number" id="ci-hrs-${esc(i.id)}" placeholder="Your hours (optional)" min="0" step="0.5" style="width:160px">
    <div class="row-end"><button class="btn sm" data-act="checkin" data-v="yes" data-id="${esc(i.id)}">Yes</button><button class="btn sm quiet" data-act="checkin" data-v="partly" data-id="${esc(i.id)}">Partly</button><button class="btn sm quiet danger" data-act="checkin" data-v="no" data-id="${esc(i.id)}">No</button></div>
  </div>`;
}
function checkInSummary(d){
  const ci = d.checkIn, a = ci.actual || {}, r = d.appetite ? appetiteRange(d.appetite) : null;
  return `<div class="note" style="margin-top:8px"><b>${esc(JOURNAL_VERDICT[ci.verdict] || ci.verdict)}</b>${ci.note ? " — " + esc(ci.note) : ""}
    <div class="faint" style="font-size:12px">Cost: ${fmt(a.tokens||0)} tok · ${money(a.cost||0)}${r ? ` vs appetite ${fmt(r.tokLo)}–${fmt(r.tokHi)}` : ""} · ${a.runs||0} run${(a.runs||0) === 1 ? "" : "s"}${ci.hours != null ? ` · ${ci.hours}h of you` : ""}</div></div>`;
}
function journalEntry(i){
  const d = i.decision, [label, tone] = JOURNAL_OUTCOME[d.outcome] || [d.outcome, ""], pick = d.pick;
  return `<article class="card journal-entry">
    <div class="ct">${esc(i.title)} <span class="tag ${tone}">${label}</span></div>
    <div class="faint" style="font-size:12px">${day(d.at)} · ${d.appetite ? esc(APPETITE_LEVELS[d.appetite]) : "No appetite set"} · ${d.rank != null ? "duel rank #" + d.rank : "unranked"}${pick ? (pick.followed ? " · followed Claude's pick" : ` · picked “${esc(pick.chosen || "")}” over Claude's “${esc(pick.recommend || "")}”`) : ""}</div>
    ${d.reason ? `<p style="margin:6px 0">${esc(d.reason)}</p>` : ""}
    ${d.outcome === "promoted" ? `<div class="faint" style="font-size:12px">Expected: ${esc(d.signal || "")}${d.signalBy ? " by " + day(d.signalBy) : ""}</div>` : ""}
    ${d.checkIn ? checkInSummary(d) : needsCheckIn(i) ? checkInForm(i, d) : ""}
  </article>`;
}
function journalView(){
  const scope = S.ideaProject, entries = journalEntries(scope), cal = calibrationLine(scope);
  const head = `${burger}<div class="crumb"><h1>Journal</h1><span class="sub">${entries.length} entr${entries.length === 1 ? "y" : "ies"}</span></div>
    <div class="acts">${ideaScopePicker()}</div>`;
  if (!S.loaded) return { head, body:`<div class="zero">Loading…</div>` };
  const lead = leadDecisions(scope);

    + (entries.length ? entries.map(journalEntry).join("")
      : `<div class="list"><div class="zero">${icon("book")}<h2>No decisions yet</h2><p>Bet, decide, park or kill an idea and it lands here: why, what you expected, and later, whether it paid off.</p></div></div>`)
    + `<h3 class="sect" style="margin:18px 0 6px" id="lead-journal">AI lead decisions${lead.length ? ` · ${lead.length}` : ""}</h3>` + leadDecisionRows(lead);
  return { head, body };
}
/* A short read on past bets in this project, fed into the explore prompt so Claude weighs new ideas against how
   Austin's own bets have actually landed here — empty until there's at least one answered one. */
function pastBetsNote(projectId){
  const answered = S.ideas.filter(i => i.projectId === projectId && i.decision?.checkIn).sort((a,b) => (b.decision.at||0) - (a.decision.at||0));

  return `WHAT YOUR PAST BETS SAY (${hitRate(answered)}% of ${answered.length} answered came back yes):\n${lines.join("\n")}`;
}

/* ---------- land card ---------- */
/* What stands between approved work and your branch, one state at a time, each with the action that clears it. */
function landCard(x, focus, i, why){
  const h = x.health || {}, repo = x.repo.split("/").pop(), data = `data-repo="${esc(x.repo)}" data-base="${esc(x.base)}"`;
  const files = list => `<div class="files">${list.map(f => `<code>${esc(f)}</code>`).join("")}</div>`;
  const head = `<div style="font-weight:600">${x.ahead} approved change${x.ahead > 1 ? "s" : ""} ready for <span class="mono">${esc(x.base)}</span> <span class="faint">· ${esc(repo)}</span></div>
    <ul>${(x.commits || []).map(c => `<li>${esc(c)}</li>`).join("")}</ul>
    ${why ? `<p style="margin:4px 0 0;font-size:12px;color:var(--st-failed)">${esc(why)}</p>` : ""}
    ${x.landAt ? `<p class="faint" style="margin:4px 0 0;font-size:12px"><span class="mono">${esc(x.base)}</span> is checked out at <span class="mono">${esc(x.landAt)}</span>, so it lands there. Your checkout here stays on <span class="mono">${esc(x.current)}</span>.</p>` : ""}`;
  let body;
  if (x.review) body = `<div class="state"><span class="stepdot">1</span><div><b>Check what Claude combined before it lands.</b>
      <p class="why">Your commits on <span class="mono">${esc(x.base)}</span> and the approved work both changed ${x.review.files.map(f => `<span class="mono">${esc(f)}</span>`).join(", ")}. Claude's note: ${esc(x.review.said || "(none)")}</p>
      <details open><summary class="faint" style="cursor:pointer">What landing changes in these files</summary><pre class="code" style="max-height:320px">${esc(x.review.diff || "(no difference from your branch)")}</pre></details>
      <div class="acts"><button class="btn sm primary" data-act="land" data-confirm="1" ${data}>${icon("land")}Looks right, land it</button><button class="btn sm" data-act="land-undo" ${data}>Undo the combine</button><span class="faint" style="align-self:center">Undo puts runway/${esc(x.base)} back to the approved work only. Then edit the file yourself and land again.</span></div></div></div>`;
  else if (x.current && x.current !== x.base && !x.landAt) body = `<div class="acts"><button class="btn sm primary" data-act="land" ${data}>${icon("land")}Land in ${esc(x.base)}</button><span class="faint" style="align-self:center">You're on <span class="mono">${esc(x.current)}</span>. Landing moves <span class="mono">${esc(x.base)}</span> forward without touching your checkout.</span></div>`;
  else if ((h.conflicted || []).length) body = `<div class="state"><span class="stepdot">1</span><div><b>Finish the earlier land first.</b>
      <p class="why">${h.conflicted.length} file${h.conflicted.length > 1 ? "s" : ""} still ha${h.conflicted.length > 1 ? "ve" : "s"} conflict markers from an earlier land, where approved work and your uncommitted edits met. Nothing can land until they're combined. Your original edits are safe in a stash and in <span class="mono">~/.ai-planner/backups</span>.</p>${files(h.conflicted)}
      <div class="acts"><button class="btn sm primary" data-act="land-resolve" ${data}>${icon("plan")}Resolve with Claude</button><span class="faint" style="align-self:center">Keeps both sides, edits only these files, checks no markers remain. Or fix them in your editor and press Refresh.</span></div></div></div>`;
  else if ((h.untrackedBlocking || []).length) body = `<div class="state"><span class="stepdot">1</span><div><b>Your own copies are in the way.</b>
      <p class="why">You have untracked files with the same names as files this work adds. Git won't overwrite them. Set yours aside (moved into <span class="mono">~/.ai-planner/backups</span>, nothing is deleted) and Runway's versions land in their place.</p>${files(h.untrackedBlocking)}
      <div class="acts"><button class="btn sm primary" data-act="land-setaside" data-paths="${esc(JSON.stringify(h.untrackedBlocking))}" ${data}>Set aside my copies</button></div></div></div>`;
  else if ((h.overlap || x.overlap || []).length) { const ov = h.overlap || x.overlap;
    body = `<div class="state"><span class="stepdot">1</span><div><b>You're editing ${ov.length} of the same file${ov.length > 1 ? "s" : ""}.</b>
      <p class="why">Commit your work first; then the land is a normal merge, and any real overlap gets combined on Runway's side. Re-applying on top also works, but if the edits touch the same lines you'll get conflict markers to sort out.</p>${files(ov)}
      <input type="text" id="wip-msg-${i}" placeholder="Commit message, e.g. WIP: intake form and admin" aria-label="Commit message">
      <div class="acts"><button class="btn sm primary" data-act="land-commit" data-k="${i}" ${data}>Commit my ${h.dirtyCount || ""} changed file${h.dirtyCount === 1 ? "" : "s"}, then land</button><button class="btn sm" data-act="land-stash" ${data}>Land and re-apply my edits</button></div></div></div>`; }
  else body = `<div class="acts"><button class="btn sm primary" data-act="land" ${data}>${icon("land")}Land in ${esc(x.base)}</button>${h.dirtyCount ? `<span class="faint" style="align-self:center">Your ${h.dirtyCount} uncommitted file${h.dirtyCount > 1 ? "s" : ""} aren't touched by this work and stay as they are.</span>` : ""}</div>`;
  const stash = (h.stashes || []).length && !(h.conflicted || []).length ? `<p class="faint" style="margin:10px 0 0;font-size:12px">An earlier land left <span class="mono">${esc(h.stashes[0].ref)}</span> (${esc(h.stashes[0].label.replace(/^On [^:]+: /, ""))}). Your edits are already back in your files; drop it when you've checked: <span class="mono">git stash drop ${esc(h.stashes[0].ref)}</span></p>` : "";
  return `<div class="landbox ${focus}" data-k="${i}"><span>${icon("land")}</span><span><span class="tag act">Land</span></span><div>${head}${body}${stash}</div></div>`;
}

/* ---------- run debugging: diagnose an empty or failed run, fix the cause, continue the same session ---------- */
const QUESTION_RE = /(\?\s*$|would you like|should i\b|tell me|do you want|which (one|option)|let me know|can i proceed|please (approve|confirm)|i'd rather you pick|your call)/i;
const NEVER_ALLOW = /^(rm|sudo|curl|wget|chmod|chown|ssh|scp|dd|mkfs|launchctl|git push|git reset --hard|git clean)\b/;
/* Every command in a shell line (chains, pipes, $(...)), without env prefixes or cd. */
function commandParts(cmd){
  const c = String(cmd || "").replace(/<<-?\s*['"]?(\w+)['"]?[\s\S]*?\n\s*\1\b/g, "") // heredoc bodies
    .replace(/"(?:\\.|[^"\\])*"|'[^']*'/g, '""'); // quoted text is arguments, never commands
  return c.split(/\$\(|`|\)|&&|\|\||;|\||\n/).map(x => x.trim().replace(/^(\w+=\S*\s+)+/, "").replace(/\s+\d?>.*$/, "").trim())
    .filter(x => x && !/^cd(\s|$)/.test(x) && /^(\.\/|\/)?[a-z][\w.\/-]*(\s|$)/.test(x));
}
// A rule is already covered when an allowed rule's command is the same or a prefix of it (Bash(pnpm:*) covers pnpm add).
const ruleCmd = r => (String(r).match(/^Bash\((.*?)(?::\*)?\)$/) || [])[1] || "";
const covered = (rule, have) => { const c = ruleCmd(rule); return have.some(h => { const hc = ruleCmd(h); return hc && (c === hc || c.startsWith(hc + " ")); }); };
/* Paths outside the repo that a denial tried to reach, turned into folders worth allowing. */
function outsideDirs(t, denials){
  const p = proj(t.projectId) || {}, home = S.settings.home || "", norm = x => String(x || "").replace(/^~(?=\/)/, home).replace(/\\ /g, " ").replace(/^"|"$/g, "");
  const repo = norm(p.repo), out = new Set();
  const vaultClaude = norm(DEFAULTS.globalReadDirs[0]);
  for (const d of denials){
    let inp = {}; try { inp = JSON.parse(d.input); } catch {}
    const cands = [inp.file_path, inp.path, ...(String(inp.command || "").match(/(?:~|\$HOME|\/Users)\/(?:\\ |[^\s"'|;&])+|"(?:~|\$HOME|\/Users)\/[^"]+"/g) || [])];
    for (const c of cands){
      const f = norm(String(c || "").replace(/^"\$HOME/, home).replace(/^\$HOME/, home));
      if (!f.startsWith("/") || (repo && f.startsWith(repo))) continue;
      out.add(f.startsWith(vaultClaude) ? vaultClaude : f.replace(/\/[^\/]*\.[^\/]*$/, ""));
    }
  }
  const have = readDirs(p).map(norm);
  // Never offer a whole home folder or ~/Projects: that would expose keys and every other repo's .env files.
  const tooBroad = d => !home || d === home || d === home + "/Projects" || d.split("/").length < home.split("/").length + 2 || /\/\.(ssh|aws|gnupg|config)(\/|$)/.test(d);
  return [...out].filter(d => d && !tooBroad(d) && !have.some(h => d.startsWith(h))).map(d => home && d.startsWith(home + "/") ? "~" + d.slice(home.length) : d);
}
/* Turn a denied shell command into a narrow allow rule, or nothing if it shouldn't be allowed. */
function allowRuleFor(cmd){
  const c = String(cmd || "").trim().replace(/^cd [^&;]+(&&|;)\s*/, "");
  if (!c || NEVER_ALLOW.test(c) || /^(cat|tee|echo|printf)\b.*>/.test(c)) return null; // file writes go through Write/Edit
  // Never suggest installing packages or running things from temp folders: the fix is the project's own setup (e.g. ./test.sh).
  if (/^(\S*\/)?(pip3?|python3?\s+-m\s+pip|uv\s+pip|brew|npm\s+i(nstall)?\s+-g)\b.*\binstall\b/.test(c) || /^\/(tmp|private\/tmp|var\/folders)\//.test(c)) return null;
  const w = c.split(/\s+/);
  const two = ["npm","pnpm","yarn","npx","git","node","python3","python","pytest","make","go","cargo","bun","supabase","vercel","docker","gh","aws","gcloud","kubectl","terraform","firebase","fly"];
  // CLIs that reach live services get their subcommand pinned to three words where it matters (supabase db reset, not supabase db push)
  if (["supabase","vercel","gh","aws","gcloud","kubectl","firebase"].includes(w[0]) && w[2] && !w[2].startsWith("-") && ["db","migration","gen","functions","secrets","projects","api","run","pr","repo"].includes(w[1])) return `Bash(${w.slice(0, 3).join(" ")}:*)`;
  if ((w[0] === "python3" || w[0] === "python") && w[1] === "-m" && w[2]) return `Bash(${w.slice(0, 3).join(" ")}:*)`;
  if (NEVER_ALLOW.test(w.slice(0, 2).join(" ")) || NEVER_ALLOW.test(w.slice(0, 3).join(" "))) return null;
  return `Bash(${two.includes(w[0]) && w[1] && !w[1].startsWith("-") ? w[0] + " " + w[1] : w[0]}:*)`;
}
const sandboxed = () => S.settings.sandboxAgents !== false;
const effectiveMode = t => sandboxed() ? "dontAsk" : proj(t.projectId)?.trust === "trusted" ? "bypassPermissions" : S.settings.permissionMode === "auto" && (t.model || S.settings.defaultModel) === "haiku" ? "acceptEdits" : S.settings.permissionMode;
/* A task's environment, from the helper's status (envs), matched by the roadmap key the task was imported with. */
function envFor(t){
  return helperOn() && t.rkey ? (S.helper.envs || []).find(e => e.task === t.rkey) || null : null;
}
/* A task's environment: preparing, ready or failed, its port block, its variable names (never values) and its setup log.
   A failed one is an environment blocker with Retry setup. The helper blanks secret values out of the log before it reaches here. */
function envSection(e){
  if (e.error) return `<div class="note bad">${esc(e.task)}: ${esc(e.error)}</div>`;
  const busy = S.envBusy === e.task;
  const label = busy ? "Retrying setup…" : { preparing:"Preparing", ready:"Ready", failed:"Failed" }[e.state] || e.state;
  const st = busy ? "running" : { preparing:"running", ready:"done", failed:"failed" }[e.state] || "todo";
  const ports = e.ports ? `${e.ports.base}–${e.ports.base + e.ports.count - 1}` : "none";
  const names = (e.names || []).map(n => `<span class="mono">${esc(n.name)}</span>${n.set ? "" : ` <span class="faint">not set</span>`}`).join(", ");
  const log = e.setup ? `<details ${e.state === "failed" ? "open" : ""}><summary class="faint" style="cursor:pointer;font-size:12px">Setup log · ${e.setup.timedOut ? "timed out" : `exit ${esc(e.setup.rc)}`}</summary><pre class="code" style="max-height:260px;overflow:auto;white-space:pre-wrap">${esc(e.setup.log || "(no output)")}</pre></details>` : "";
  const card = e.state === "failed" && !busy ? `<div class="diagbox"><div class="dg-h">${icon("alert")}<b>Environment not ready</b></div>
      <p style="margin:0">${e.setup ? "Setup failed, so the agent was not started. Fix the setup, then retry: it runs again in the same worktree and the agent starts." : "A variable it needs is not set, so the agent was not started. Set it in the env file, then retry."}</p>
      ${e.detail && !e.setup ? `<pre class="code" style="white-space:pre-wrap">${esc(e.detail)}</pre>` : ""}
      <div class="row-end" style="justify-content:flex-start"><button class="btn primary" data-act="env-retry" data-k="${esc(e.task)}" data-repo="${esc(e.repo || "")}">Retry setup</button></div></div>` : "";
  return `<div style="display:flex;flex-direction:column;gap:8px">
    <div class="row-end" style="justify-content:flex-start;gap:14px">${stDot(st, label)}<span class="faint">Ports <span class="mono">${ports}</span></span><span class="faint">Variables ${names || "none"}</span></div>
    ${log}${card}</div>`;
}
/* The environments of the autopilot's task runs, above the chunks in Runs. */
function envsSection(){
  if (!helperOn()) return "";
  const es = S.helper.envs;
  if (!Array.isArray(es)) return `<div class="note">Environments need the newer helper. Update it from Settings to see them.</div>`;
  if (!es.length) return `<p class="faint" style="font-size:12.5px;margin:0 0 12px">No task has an environment yet. A project gets one when its .runway.json declares setup, env or ports.</p>`;
  return `<div class="sect">Environments</div>` + es.map(e => `<div style="margin-bottom:14px">${e.error ? "" : `<div class="faint" style="font-size:12px;margin-bottom:6px">${esc(e.task)}${e.repo ? ` · ${esc(e.repo.split("/").pop())}` : ""}</div>`}${envSection(e)}</div>`).join("");
}
/* The variable names a project passes to its tasks and the env file to fill in: names and whether each is set, never values. */
function envFieldHtml(repo){
  if (!repo || !helperOn()) return "";
  const path = repo.startsWith("~/") ? S.settings.home + repo.slice(1) : repo;
  const c = S.envInfo[path];
  if (c === undefined){ loadEnvInfo(path); }
  if (!c) return `<div class="fld"><label>Environment</label><div class="faint"><span class="spin" style="display:inline-block"></span> Reading the project's environment…</div></div>`;
  if (c.err) return `<div class="fld"><label>Environment</label><div class="note bad">${esc(c.err)}</div></div>`;
  return `<div class="fld"><label>Environment</label>
    <div style="font-size:12.5px">${c.names.length ? c.names.map(n => `<span class="mono">${esc(n.name)}</span> ${n.set ? "<b>set</b>" : `<span class="faint">not set</span>`}`).join(" · ") : `<span class="faint">No variables: this project passes none.</span>`}${c.ports ? ` · <span class="faint">${c.ports} port${c.ports > 1 ? "s" : ""}</span>` : ""}</div>
    <span class="hint">Fill in the values in <span class="mono">${esc(c.file)}</span>${c.exists ? "" : " (not created yet)"} on your Mac. Runway shows names only, never values.</span></div>`;
}
async function loadEnvInfo(repo){
  S.envInfo[repo] = null; // pending: the form shows a spinner until the helper answers
  try {
    const out = await host(`python3 ${HELPER} env-info ${sq(repo)}`, 20000);
    const ok = out.match(/@@ENVINFO (.*)/), err = out.match(/@@ERR (.*)/);
    S.envInfo[repo] = ok ? JSON.parse(ok[1]) : { err: err ? err[1] : "The helper did not report this project's environment." };
  } catch (e){ S.envInfo[repo] = { err: e.code === "cancelled" ? "Cancelled." : hostErrCopy(e) }; }
  S._ovSig = null; render(); // the overlay only redraws when its signature changes
}
/* The worktree setup command: the "setup" key _ap_prepare reads from <repo>/.runway.json, committed with the project.
   Editable here because the file is never reached from the page's own project record (see config.md). */
function setupFieldHtml(repo){
  if (!repo || !helperOn()) return "";
  const path = repo.startsWith("~/") ? S.settings.home + repo.slice(1) : repo;
  const c = S.setupInfo[path];
  if (c === undefined){ loadSetupInfo(path); }
  if (!c) return `<div class="fld"><label>Worktree setup command</label><div class="faint"><span class="spin" style="display:inline-block"></span> Reading .runway.json…</div></div>`;
  if (c.err) return `<div class="fld"><label>Worktree setup command</label><div class="note bad">${esc(c.err)}</div></div>`;
  return `<div class="fld"><label for="p-setup">Worktree setup command</label><input type="text" id="p-setup" value="${esc(c.value)}" placeholder="e.g. npm ci"><span class="hint">Runs once in a new worktree, before its agent starts (for example to install dependencies). Saved to <span class="mono">.runway.json</span> in the repo. Leave empty for none.</span></div>`;
}
async function loadSetupInfo(repo){
  S.setupInfo[repo] = null; // pending: the form shows a spinner until the helper answers
  try {
    const out = await host(`python3 ${HELPER} config-get ${sq(repo)} setup`, 20000);
    const ok = out.match(/@@CONFIG (.*)/), err = out.match(/@@ERR (.*)/);
    S.setupInfo[repo] = ok ? { value: JSON.parse(ok[1]) } : { err: err ? err[1] : "The helper did not report this project's setup command." };
  } catch (e){ S.setupInfo[repo] = { err: e.code === "cancelled" ? "Cancelled." : hostErrCopy(e) }; }
  S._ovSig = null; render();
}
/* Writes the field to .runway.json, only when it changed (the field is absent, so a no-op, while the helper is off or still reading). */
async function saveSetupCmd(repo){
  const el = $("#p-setup");
  if (!el || !repo) return;
  const path = repo.startsWith("~/") ? S.settings.home + repo.slice(1) : repo;
  const value = el.value.trim();
  if (S.setupInfo[path]?.value === value) return;
  try {
    const out = await host(`python3 ${HELPER} config-set ${sq(path)} setup ${sq(value)}`, 20000);
    const err = out.match(/@@ERR (.*)/);
    if (err) toast("Worktree setup command: " + err[1]);
    else { const ok = out.match(/@@CONFIG (.*)/); S.setupInfo[path] = { value: ok ? JSON.parse(ok[1]) : value }; }
  } catch (e){ if (e.code !== "cancelled") toast(hostErrCopy(e)); }
}
/* Retry setup: the helper runs the failed setup again in the task's worktree, then starts its agent. */
async function retryEnv(repo, k){
  if (S.envBusy) return;
  S.envBusy = k; S._ovSig = null; render();
  try {
    const out = await host(`python3 ${HELPER} retry-setup ${sq(repo)} ${sq(k)}`, 960000);
    const err = out.match(/@@ERR (.*)/);
    toast(err ? err[1] : "Setup passed. The agent is starting.");
  } catch (e){ if (e.code !== "cancelled") toast(hostErrCopy(e)); }
  finally { S.envBusy = null; S._ovSig = null; render(); }
}

/* What went wrong, in plain words, with the fixes Runway can apply. */
function diagnose(t){
  const env = envFor(t);
  if (env?.state === "failed") return { kind:"environment", title:"Environment not ready", detail: env.detail || env.setup?.log || "", fixes: [] };
  const r = t.run || {}; if (!r.chunkId || t.status === "running") return null;
  const oc = r.outcome;
  if (oc && oc.status !== "done" && (oc.blockers || []).length && !r.blockerHandled)
    return { kind:"blocked", title: oc.status === "partial" ? `Partly done: ${oc.blockers.length} thing${oc.blockers.length > 1 ? "s" : ""} need you` : `Blocked on ${oc.blockers.length} thing${oc.blockers.length > 1 ? "s" : ""}`, blockers: oc.blockers, partial: oc.status === "partial", fixes: [] };
  const empty = r.files === 0 || (r.files == null && r.mergeOutcome === "empty" && r.mergeApplied), denials = r.denials || [];
  if (t.status === "review" && r.files > 0 && r.verify?.unverifiable && !(r.diagnosis && r.diagnosis.at >= (t.finishedAt || 0)))
    return { kind:"unverifiable", title:"Reviewer couldn't verify everything", detail: r.verify.notes || "",
      fixes: [{ type:"claude", label:"Ask Claude what's wrong" }] };
  if (t.status === "review" && r.files > 0 && r.verify?.pass === false && !(r.diagnosis && r.diagnosis.at >= (t.finishedAt || 0))){
    if (r.fixCap) return { kind:"checks",
      title: `Stopped after ${r.fixCap.rounds} fix round${r.fixCap.rounds > 1 ? "s" : ""}: ${r.fixCap.reason === "repeated" ? "the checker kept repeating the same note" : "it hit the fix-round limit"}`,
      detail: `Spent about $${(r.fixCap.cost || 0).toFixed(2)} on this task's rounds so far. Runway stopped relaunching it automatically rather than spend more on a note that wasn't changing anything.\n\nThe checker's last note:\n${r.fixCap.note || ""}`,
      fixes: [{ type:"checkfix", label:"Send the notes back to the agent anyway" }, { type:"claude", label:"Ask Claude what's wrong" }] };
    return { kind:"checks", title: r.rounds ? `Checks still fail after ${r.rounds} fix round${r.rounds > 1 ? "s" : ""}` : "Acceptance checks fail",
      detail: r.verify.notes || "", fixes: [{ type:"checkfix", label:"Send the notes back to the agent" }, { type:"claude", label:"Ask Claude what's wrong" }] };
  }
  // Work that changed files and passed its check is not a failure, even if a few commands were denied along the way.
  if (t.status === "review" && r.files > 0) return null;
  if (r.diagnosis && r.diagnosis.at >= (t.finishedAt || 0)) return r.diagnosis; // Claude's diagnosis for this attempt
  if (t.status === "paused" && /budget guard/.test(r.err || "")) return { kind:"budget", title:"Stopped at its budget guard", detail: r.err, fixes:[{ type:"continue", label:"Continue it" }] };
  if (denials.length){
    const writes = denials.filter(d => ["Write","Edit","MultiEdit","NotebookEdit"].includes(d.tool));
    const cmds = denials.filter(d => d.tool === "Bash").map(d => { try { return JSON.parse(d.input).command; } catch { return ""; } });
    const p = proj(t.projectId) || {}, have = agentTools(p);
    const rules = [...new Set(cmds.flatMap(commandParts).map(allowRuleFor).filter(Boolean))].filter(x => !covered(x, have));
    const dirs = outsideDirs(t, denials);
    const engineFixed = writes.length && (t.model || S.settings.defaultModel) === "haiku" && S.settings.permissionMode === "auto";
    const fixes = [];
    const need = cmds.map(c => (String(c).replace(/^cd [^&;]+(&&|;)\s*/, "").match(/^git\s+(?:merge|rebase|pull(?:\s+origin)?)\s+(?:-\S+\s+)*([\w./-]+)/) || [])[1]).find(b => b && b !== (r.base || "") && !isRunwayBranch(b));
    if (need) fixes.push({ type:"base", branch: need, label:`Start over from ${need}` });
    if (dirs.length) fixes.push({ type:"dirs", dirs, label:`Always let this project's agents read ${dirs.join(", ")}` });
    if (rules.length && !need) fixes.push({ type:"allow", rules, label:`Always allow ${rules.join(", ")} on this project` }, { type:"allowAll", rules, label:"…on every project" });
    if (p.trust !== "trusted" && !need) fixes.push({ type:"trust", label:"Trust this project: allow everything except the never-allow list" });
    if (writes.length && !engineFixed && effectiveMode(t) !== "acceptEdits" && effectiveMode(t) !== "bypassPermissions") fixes.push({ type:"model", model:"sonnet", label:"Run it on Sonnet" });

async function rewriteBrief(t){
  if (!S.sample || S.overlay?.rewriteBusy) return;
  const o = S.overlay; o.rewriteBusy = true; o.rewriteErr = ""; render();
  const prompt = `Rewrite only the acceptance criteria for this Claude Code agent task into testable statements a reviewer can check from a diff: each one must name the file, command, test or observable output that proves it. Keep the task's goal and scope the same, and keep roughly the same number of criteria. Drop anything that needs a deploy, a publish, a push to a remote, a real account or credentials, a decision or sign-off by Austin, or a manual check in a browser; state what the agent itself can verify instead.

TASK: ${t.title}
BRIEF: ${t.detail || "(none)"}
CURRENT ACCEPTANCE:
${t.acceptance || "(none)"}

Reply with only JSON: {"acceptance":"- ...\\n- ..."}`;
  try {
    const out = await S.sample.json(prompt, { modelTier:"default", cache:false });
    const after = String(out?.acceptance || "").trim();
    if (!after) throw { code:"invalid_json" };
    o.rewriteBusy = false; o.rewrite = { before: t.acceptance || "", after };
  } catch (e) { o.rewriteBusy = false; o.rewriteErr = sampleErrCopy(e); }
  render();
}
async function applyBriefRewrite(t){

async function dismissBriefIssue(t, kind, criterion){

  if ((t.briefLintDismissed || []).includes(key)) return;

function diffPane(t){
  const r = t.run || {};
  if (!r.chunkId || !r.wt) return `<div class="zero" style="padding:40px"><h2>No changes to show</h2><p>${r.chunkId ? "This task ran in the repo checkout." : "This task hasn't run yet."}</p></div>`;
  const c = S.diffCache[t.id];
  if (!c){ loadDiff(t); return `<div class="zero" style="padding:40px"><span class="spin" style="display:inline-block"></span><p>Loading changes…</p></div>`; }
  if (c.err) return `<div class="note">${esc(c.err)}</div>${r.diff ? `<pre class="code">${esc(r.diff)}</pre>` : ""}`;
  const files = []; let cur = null;
  for (const line of c.text.split("\n")){
    if (line.startsWith("diff --git")){ cur = { name: line.replace(/^diff --git a\/(.+?) b\/.*$/, "$1"), lines: [], add:0, del:0 }; files.push(cur); continue; }
    if (!cur || /^(index |--- |\+\+\+ |new file|deleted file|similarity|rename |old mode|new mode|Binary)/.test(line)){ if (cur && line.startsWith("Binary")) cur.lines.push({ c:"h", s:"Binary file" }); continue; }
    if (line.startsWith("@@")) cur.lines.push({ c:"h", s:line });
    else if (line.startsWith("+")){ cur.add++; cur.lines.push({ c:"a", s:line }); }
    else if (line.startsWith("-")){ cur.del++; cur.lines.push({ c:"d", s:line }); }
    else cur.lines.push({ c:"", s:line });
  }
  if (!files.length) return `<div class="note">The agent made no changes.</div>`;
  return `<div class="faint">${files.length} file${files.length > 1 ? "s" : ""} · <span style="color:var(--add)">+${files.reduce((a,f) => a + f.add, 0)}</span> <span style="color:var(--del)">−${files.reduce((a,f) => a + f.del, 0)}</span>${c.truncated ? " · showing the first part" : ""}</div>`
    + files.map(f => `<div class="diff"><div class="fh"><span>${esc(f.name)}</span><span class="num"><span style="color:var(--add)">+${f.add}</span> <span style="color:var(--del)">−${f.del}</span></span></div><pre>${f.lines.slice(0, 400).map(l => `<span class="ln ${l.c}">${esc(l.s) || " "}</span>`).join("")}</pre></div>`).join("");
}
async function loadDiff(t){
  if (S.diffCache[t.id] || !S.mcp || !S.settings.home) { if (!S.diffCache[t.id]) S.diffCache[t.id] = { err:"Changes can be shown when Runway is open in the Claude app with the helper installed." }; return; }
  S.diffCache[t.id] = null;
  try {
    const res = await S.mcp.callTool(HOST, "read_file", { path: `${S.settings.home}/.ai-planner/runs/${t.run.chunkId}/${t.id}.patch`, length: 4000 });
    let text = resultText(res); const m = text.match(/^\[Reading (\d+) lines.*?(?:total: (\d+))?.*\]\s*\n/);
    if (m) text = text.slice(m[0].length);
    S.diffCache[t.id] = { text, truncated: m && m[2] && +m[2] > 4000 };
  } catch (e) {
    S.diffCache[t.id] = { err: e.code === "tool_error" ? "The full diff isn't saved for this run (older run, or the worktree was already merged). Here's the summary:" : hostErrCopy(e) };
  }
  if (S.overlay?.kind === "task" && S.overlay.id === t.id){ S._ovSig = null; render(); }
}

    ["Plan with Claude", "", () => click("planner")], ["Fill a chunk", "", () => { go("board"); autofill(); }],

    ["Refresh agent status", "", () => checkNow()], ["New project", "", () => click("new-project")], ["Settings", "", () => click("settings")],
  ].map(([label, key, run]) => ({ label, key, run, group:"Command" }));
  const projs = S.projects.flatMap(p => [{ label: p.name, key:"", group:"Project", run: () => { S.projectId = p.id; go("board"); } },
    { label: `Ideas for ${p.name}`, key:"", group:"Ideas", run: () => { S.ideaProject = p.id; go("ideas"); } }]);
  const tasks = q ? S.tasks.filter(t => t.title.toLowerCase().includes(q)).slice(0, 8).map(t => ({ label: t.title, key: ST_LABEL[t.status], group:"Task", run: () => { S.overlay = { kind:"task", id:t.id }; render(); } })) : [];

  return (q ? all.filter(i => i.group === "Task" || i.label.toLowerCase().includes(q)) : all).slice(0, 14);

function launchCommand(chunkId, script, at){
  const D = `"$HOME/.ai-planner/runs/${chunkId}"`;
  const write = `mkdir -p ${D} && printf %s ${sq(b64(script))} | base64 --decode > ${D}/run.sh`;
  if (at) return `${write} && python3 ${HELPER} queue ${chunkId} ${Math.round(at/1000)}`;
  return `${write} && if [ -f ${HELPER} ]; then python3 ${HELPER} launch ${chunkId}; else cd ${D} && (nohup bash run.sh > runner.log 2>&1 &) && echo "@@LAUNCHED ${chunkId}"; fi`;
}

async function launch(at, opts = {}){
  if (S.launching) return;
  let sel = [...S.sel].map(task).filter(t => t && t.status !== "running");
  // Never rerun a task the agent said is blocked until the blocker is handled.
  const blocked = sel.filter(isBlocked); sel = sel.filter(t => !isBlocked(t));
  // Parked work, later sprints behind unfinished ones, and tasks waiting on an unresolved blocker don't start (launchGate).
  const gated = sel.filter(launchGate); sel = sel.filter(t => !launchGate(t));
  // Tasks whose dependencies aren't merged yet wait, and start on their own once they are.
  const waiting = sel.filter(t => !depsMet(t)); sel = sel.filter(depsMet);
  for (const t of waiting) if (!t.held) patch("tasks", t.id, { held: true });
  const skipped = [blocked.length ? `${blocked.length} still blocked (resolve it first)` : "", gated.length ? `${gated.length} gated (${[...new Set(gated.map(t => launchGate(t).msg))].slice(0, 2).join("; ")})` : "", waiting.length ? `${waiting.length} will start once the work ${waiting.length > 1 ? "they need is" : "it needs is"} merged` : ""].filter(Boolean).join("; ");
  if (!sel.length){ if (skipped) toast("Nothing launched: " + skipped + "."); S.sel.clear(); render(); return; }
  S.launching = true;
  // The cards change the moment Launch is pressed: "Checking before launch…", then "Starting…" until they read Running.
  S.launchingIds = new Set(sel.map(t => t.id)); S.launchPhase = !opts.skipPreflight && !at ? "check" : "start"; S.sel.clear(); render();
  try {
    if (!opts.skipPreflight && !at){
      const probs = await runPreflight(sel);
      if (probs === null) return; // cancelled
      if (probs.length){ S.overlay = { kind:"preflight", probs, ids: sel.map(t => t.id) }; return; }
    }
    S.launchPhase = "start"; render();
    for (const t of sel) if (t.held) patch("tasks", t.id, { held: false });
    await launchNow(sel, at);
    if (skipped) toast("Launched " + sel.length + ". " + skipped + ".");
  } finally { S.launching = false; S.launchingIds = null; render(); livePoll(); }
}
/* Before spending tokens: is each repo usable, is the checkout mid-merge, does the start branch exist, and do the
   project's own requirement checks (docker info and the like) pass? Returns the problems, or null if cancelled. */
const PF_TRUST_MS = 30 * 60e3;
// Off by default (settings.briefCheck): a brief with no criteria, an untestable one, or one needing something an
// agent can't do here stops a launch the same way a missing repo or red check does, once a project turns it on.
const BRIEF_BLOCKING_KINDS = ["no-criteria", "untestable", "outside-agent"];
// Settings.startCheck (off unless turned on, like briefCheck): one cheap Haiku read per task asks whether an unattended
// agent can finish the brief. Foundations, needs-you steps and open decisions become 'start' problems; the check
// itself never blocks (the helper answers ok when it breaks). Automatic launches hold those tasks instead of asking.
async function startProblems(sel, auto){
  const real = sel.filter(t => t && t.id !== "_chat" && task(t.id) && !(t.run?.session && t.status === "paused") && !t.blockerKey);
  if (!S.settings.startCheck || !real.length) return [];
  const spec = real.map(startSpecOf);
  let res = [];
  try {
    const out = await host(`python3 ${HELPER} start-check ${sq(b64(JSON.stringify(spec)))}`, 150000);
    const m = out.match(/@@STARTCHECK (.*)/); res = m ? JSON.parse(m[1]) : [];
  } catch (e) { if (e.code === "cancelled") throw e; return []; }
  const probs = [];
  for (const r of res){ const t = task(r.id); if (!t) continue;
    for (const x of r.missing || []) probs.push({ kind:"start", project: proj(t.projectId)?.name || "", projectId: t.projectId, taskId: t.id, item: x,
      detail: `"${t.title}": ${x.detail}${x.needs ? " (needs: " + x.needs + ")" : ""}` }); }
  if (auto){ // hands-off launches hold the task instead of showing a modal, and carry on with the rest
    for (const x of probs.filter(p => p.kind === "start")){ const t = task(x.taskId); if (t && (!t.blockerKey || x.item.type === "needs_you" && t.blockerKey.startsWith("start:"))) await holdStart(t, x.item); }
    const held = new Set(probs.map(p => p.taskId));
    for (let i = sel.length - 1; i >= 0; i--) if (held.has(sel[i].id)) sel.splice(i, 1);
    return sel.length ? [] : null;
  }
  return probs;
}
// Hold: the task carries the missing item as its blocker (blockerKey/blockedAt, {type, detail, needs}) until it is handled.
async function holdStart(t, item){
  t = task(t.id) || t;
  const steps = item.type === "needs_you" ? { needsYou: addSteps(t, [stepFrom(item.detail || item.needs)]) } : {}; // a needs_you hold is a checklist step
  if (t.blockerKey?.startsWith("start:") && item.type === "needs_you"){ await patch("tasks", t.id, steps); return; }
  await patch("tasks", t.id, { ...steps, blockerKey: "start:" + item.type + ":" + slug(item.detail), blockerDetail: String(item.needs || item.detail || "").slice(0, 200), blockedAt: now(), blocker: { type: item.type, detail: item.detail, needs: item.needs || "" } });
}
async function runPreflight(sel){
  const auto = !!S.autoLaunch; S.autoLaunch = false;
  const probs = [];
  if (S.settings.briefCheck){
    for (const t of sel){
      const issues = briefLint(t, proj(t.projectId)).filter(x => BRIEF_BLOCKING_KINDS.includes(x.kind));
      if (issues.length) probs.push({ kind:"brief", project: proj(t.projectId)?.name || "", projectId: t.projectId, taskId: t.id,
        detail: `"${t.title}": ${issues.length} brief issue${issues.length > 1 ? "s" : ""} (${issues.map(x => x.kind).join(", ")})`, issues });
    }
  }
  if (!S.mcp || !helperOn()) return probs;
  try { const sp = await startProblems(sel, auto); if (sp === null) return null; probs.push(...sp); } catch (e) { if (e.code === "cancelled") return null; }
  const ps = [...new Set(sel.map(t => t.projectId))].map(proj).filter(Boolean);
  // A project's own requirement checks (a build, docker info) can take a minute: once they pass, they are trusted for
  // PF_TRUST_MS. The repo, checkout and branch checks are quick and always run.
  S.pfOk = S.pfOk || {};
  const reqKey = p => p.id + ":" + JSON.stringify(p.requires || []);
  const fresh = p => now() - (S.pfOk[reqKey(p)] || 0) < PF_TRUST_MS;
  const spec = ps.map(p => ({ name: p.name, repo: p.repo, start: sel.filter(t => t.projectId === p.id).map(startFrom).find(Boolean) || "", requires: fresh(p) ? [] : (p.requires || []) }));
  try {
    const out = await host(`python3 ${HELPER} preflight ${sq(b64(JSON.stringify(spec)))}`, 120000);
    const m = out.match(/@@PREFLIGHT (.*)/); if (!m) return probs;
    const res = JSON.parse(m[1]);
    for (const r of res){ const p = ps.find(x => x.name === r.project); if (p && !r.problems.some(x => x.kind === "env")) S.pfOk[reqKey(p)] = now(); }
    return [...probs, ...res.flatMap(r => r.problems.map(x => ({ ...x, project: r.project, projectId: ps.find(p => p.name === r.project)?.id })))];
  } catch (e) { if (e.code === "cancelled") return null; return probs; }
}

/* When a task's dependencies land, start the tasks that were waiting on them. */
function launchHeld(){
  if (S.launching || !helperOn() || S.overlay || now() - (S.heldTriedAt || 0) < 5 * 60e3) return;
  const ready = S.tasks.filter(t => t.held && t.status === "todo" && depsMet(t) && !isBlocked(t) && !t.blockerKey && !launchGate(t));
  if (!ready.length) return;
  toast(`Starting ${ready.length} task${ready.length > 1 ? "s" : ""} whose dependencies just merged…`);

async function launchNow(sel, at){

  const chunkId = "ch" + new Date().toISOString().slice(0,16).replace(/[-:T]/g,"") + Math.random().toString(36).slice(2,5);
  const script = runnerScript(chunkId, waves), cmd = launchCommand(chunkId, script, at);
  const names = [...new Set(sel.map(t => proj(t.projectId)?.name))].join(" + ");
  await put("chunks", chunkId, { name: `${names} · ${sel.length} agent${sel.length > 1 ? "s" : ""}`, createdAt: now(), taskIds: sel.map(t => t.id), estTotal: adjSum(sel),
    status: at ? "queued" : "launching", at: at || null, waves: waves.map(w => ({ ids: w.map(t => t.id) })) });
  for (const t of sel){
    const resume = resumable(t);
    // Caught at the moment of launch, so a later edit to the brief doesn't change what this run is scored against.
    const lint = briefLint(t, proj(t.projectId));
    // Whether the project's readable folders changed since this task's last run, so Run health can compare the
    // access-blocked rate before and after. No previous run (no recorded snapshot yet) is never "added".
    const prevDirs = t.run?.readDirsAtLaunch, curDirs = readDirs(proj(t.projectId));
    const readDirsAdded = !!prevDirs && curDirs.some(d => !prevDirs.includes(d));
    await patch("tasks", t.id, { status:"running", prevStatus: t.status, resumePrompt: null,
      run: { ...RUN_RESET, chunkId, startedAt: now(), leaseUntil: now() + (S.settings.agentTimeoutMin || AGENT_TIMEOUT_MIN) * 60e3 + LEASE_GRACE_MS, estAtLaunch: t.estTokens || 0, adjAtLaunch: Math.round(adjT(t)), factorAtLaunch: +factorFor(t).toFixed(3), profile: S.settings.leanAgents ? "lean" : "full", guardUsd: +guardUsd(t).toFixed(2), resumed: !!resume, session: resume ? t.run.session : null, wt: t.run?.wt || "", prevActual: resume ? (t.actualTokens || 0) : 0, prevCost: resume ? (t.costUsd || 0) : 0,
        lintIssues: lint.length, lintKinds: [...new Set(lint.map(x => x.kind))], readDirsAtLaunch: curDirs, readDirsAdded } });
  }
  S.sel.clear(); render(); // stay where Launch was pressed: the cards show the run live
  if (!S.mcp){ await patch("chunks", chunkId, { status:"script" }); openScript(chunkId, script, cmd, "This view cannot reach your Mac. Paste the command in Terminal to start the agents."); return; }
  toast(at ? "Queuing the chunk on your Mac…" : "Starting agents on your Mac…");
  try {
    const text = await host(cmd, 15000);
    if (text.includes("@@LAUNCHED")){ await patch("chunks", chunkId, { status:"running", launchedAt: now() }); toast(`Launched ${sel.length} agent${sel.length > 1 ? "s" : ""}.`); }
    else if (text.includes("@@QUEUED")){ toast(`Queued for ${clock(at)}. Your Mac needs to be awake then.`); }
    else { await patch("chunks", chunkId, { status:"unknown", launchOutput: text.slice(-600) }); toast("The command ran but did not confirm. Check Runs before relaunching."); }

    if (e.code === "cancelled"){

      await del("chunks", chunkId); toast("Launch cancelled."); S.view = "board";
    } else if (e.code === "server_unavailable" || e.code === "upstream_error"){
      await patch("chunks", chunkId, { status:"unknown" }); toast(hostErrCopy(e));
    } else { await patch("chunks", chunkId, { status:"script" }); openScript(chunkId, script, cmd, hostErrCopy(e) + " You can paste the command in Terminal instead."); }

async function hostAction(cmd, okText){
  try {
    const out = await host(cmd, 30000);
    const bg = out.match(/@@RESOLVING (\S+) ([^\n]*)/);
    if (bg){ toast(bg[2]); S.landJobs = new Set([...(S.landJobs || []), bg[1]]);

async function checkNow(){
  const active = S.chunks.filter(c => c.status !== "complete").map(c => c.id);
  if (!active.length && !(helperOn() && S.helper.v >= MCP_V)) return; // with the MCP helper, Refresh also picks up new session claims
  toast("Checking agents…");
  let text;
  try { text = await host(`if [ -f ${HELPER} ]; then python3 ${HELPER} status ${active.join(" ")}; else echo "@@NOHELPER"; fi`, 20000); }
  catch (e) { if (e.code !== "cancelled") toast(hostErrCopy(e)); return; }
  if (text.includes("@@NOHELPER")){ toast("Install the helper to read agent status."); return; }
  const m = text.match(/@@BEGIN([\s\S]*)@@END/);
  if (!m){ toast("Could not read agent status."); return; }
  try { S.helper = JSON.parse(m[1]); S.helperAt = now(); S.helperState = "on"; } catch { toast("Agent status was unreadable."); return; }
  await applyHelper(); render(); toast("Status updated.");
}

/* ---------- design round (PI 10 Sprint 2) ----------
   One sample call lists the decisions a PI's tasks will need, so agents rarely stop to ask. The open ones live on the
   PI (pi.openDecisions); an escalated one gates its tasks (decisionGate) until Austin answers. An answer moves to the
   project's shared decision log (project.decisions, which the AI lead also writes to), is injected into the affected
   tasks' agent prompts (decisionsFor), and is appended to the vault's decision log. */
const decisionsFor = t => (proj(S.pis.find(x => x.id === t.piId)?.projectId || t.projectId)?.decisions || []).filter(d => !d.supersededBy && (d.tasks || []).includes(t.id));
const DESIGN_RULES = `A decision is ESCALATED (escalate: true) when the choice touches money, clients, anything outside the repo (accounts, deploys, DNS, publishing, email), the brand, or anything irreversible. Everything else is routine (escalate: false): naming, structure, libraries, file formats, defaults, test approach, copy tone inside the product.`;
function designPrompt(pi){
  const p = proj(pi.projectId) || {}, sps = sprintsOf(pi.id);
  const tasks = sps.map(sp => `SPRINT ${sp.name}${sp.goal ? ": " + sp.goal : ""}\n` + tasksOf(sp.id).filter(t => t.status !== "dropped").map(t => `- task ${t.id} · ${t.title}\n  brief: ${(t.detail || "").slice(0, 900)}\n  acceptance: ${(t.acceptance || "").slice(0, 400).replace(/\n/g, " ")}`).join("\n")).join("\n\n");
  const logged = [...(p.decisions || []), ...(pi.openDecisions || [])].map(d => `- ${d.id}: ${d.question}${d.answer ? " → " + d.answer : " (open)"}`).join("\n");

PROJECT: ${p.name || ""}${p.goal ? "\nPROJECT GOAL: " + p.goal : ""}${p.agentNotes ? "\nRULES FOR AGENTS:\n" + p.agentNotes : ""}
PI: ${pi.name}${pi.objective ? " — " + pi.objective : ""}

${tasks}

DECISIONS ALREADY LOGGED OR OPEN (do not list these again):
${logged || "(none)"}

${DESIGN_RULES}

For each decision give: a short kebab-case id (reuse the id a brief names as "decision <id>"), the question, why (which tasks it affects and how), 2–4 options each with its consequence, recommended (the 0-based index of the option you recommend), escalate (true/false), category (one of: money, client, external, brand, irreversible, architecture, product, naming, other), and tasks (the task ids it affects, from the list above). Only list decisions that a task actually needs; no padding. If there are none, reply with an empty list.

Reply with only JSON: {"decisions":[{"id":"db-choice","question":"...","why":"...","options":[{"label":"...","consequence":"..."}],"recommended":0,"escalate":false,"category":"architecture","tasks":["t..."]}]}`;

/* The sample's answer as storable decisions: bad rows dropped, anything already in the log or open skipped, an unclear
   escalate flag treated as escalated (the safe side), and tasks narrowed to this PI's. */
function normalizeDecisions(raw, pi){
  const arr = Array.isArray(raw) ? raw : Array.isArray(raw?.decisions) ? raw.decisions : [];
  const ids = new Set(tasksOfPi(pi.id).filter(t => t.status !== "dropped").map(t => t.id));
  const known = [...(proj(pi.projectId)?.decisions || []), ...(pi.openDecisions || [])];
  const seenId = new Set(known.map(d => d.id)), seenQ = new Set(known.map(d => bkNorm(d.question))), out = [];
  for (const x of arr){
    const question = String(x?.question || "").trim(); if (!question) continue;
    const id = slug(x.id || question).slice(0, 40);
    if (seenId.has(id) || seenQ.has(bkNorm(question))) continue;
    const options = (Array.isArray(x.options) ? x.options : []).map(o => typeof o === "string" ? { label:o, consequence:"" } : { label:String(o?.label || o?.option || o?.name || ""), consequence:String(o?.consequence || o?.impact || "") }).filter(o => o.label).slice(0, 4);
    if (options.length < 2) continue;
    let rec = typeof x.recommended === "number" ? x.recommended : options.findIndex(o => o.label.toLowerCase() === String(x.recommended || "").toLowerCase());
    if (!(rec >= 0 && rec < options.length)) rec = 0;
    const tasks = (Array.isArray(x.tasks) ? x.tasks : []).filter(t => ids.has(t));
    seenId.add(id); seenQ.add(bkNorm(question));
    out.push({ id, question, why:String(x.why || ""), options, recommended: rec, escalate: !(x.escalate === false || x.escalate === "false"), category:String(x.category || ""), tasks: tasks.length ? tasks : [...ids] });
  }
  return out;
}

async function splitTask(t){

  try {

/* Write an imported task's outcome back to its Notion row: Status Done, Completed today, Result = the merge note
   or the agent's report. Runs once per task: a row already marked synced is never written again. A failure is kept
   on the task (notionSync) for the drawer and card to show, and Retry sends the same text again. */
async function syncNotion(t0, result){
  const t = task(t0?.id) || t0;
  if (!t?.notionUrl || t.notionSync?.state === "done" || S.notionBusy.has(t.id)) return;
  const text = String(result || "").slice(0, 1900);

    if (!S.mcp) throw { code:"capability_disabled" };
    await S.mcp.callTool(NOTION, NOTION_UPDATE, { page_id: notionPageId(t.notionUrl), command: "update_properties", properties: {
      Status: "Done", "date:Completed:start": localDay(), "date:Completed:is_datetime": 0, Result: text } });

    await patch("tasks", t.id, { notionSync: { state:"failed", at: now(), err: notionErrCopy(e), result: text } });
    toast("Notion row not updated. See the task.");
  } finally { S.notionBusy.delete(t.id); render(); }
}
const notionPageId = url => String(url).split("?")[0].match(/[0-9a-f]{8}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{4}-?[0-9a-f]{12}/i)?.[0] || String(url);

function notionErrCopy(e){
  const c = e && e.code;

  if (c === "server_not_connected") return "Connect Notion in claude.ai Settings → Connectors, then retry.";
  if (c === "needs_reauth") return "Reconnect Notion in claude.ai Settings → Connectors, then retry.";
  if (c === "not_in_manifest") return "Notion updates are turned off for this page. Allow " + NOTION_UPDATE + " in the page's Permissions menu, then retry.";
  if (c === "tool_error") return "Notion refused the update: " + String(e.message || "").slice(0, 160);

const CHAT_INSTR = `You are Runway's built-in assistant. Runway plans software projects as PIs, sprints and token-estimated tasks, launches headless Claude Code agents for them on Austin's Mac (each in its own git worktree), checks their work, merges approved work onto runway/<branch>, and lands it into Austin's branch. You help Austin resolve problems: stuck or blocked tasks, failed checks, merge or land trouble, permission denials, launch checks that fail, and bugs in the projects themselves.

How to work:
- Look before you answer: use the read tools (overview, task, project, run logs, preflight) to find the real cause. Quote the evidence briefly.
- Then fix it by calling propose_fixes with concrete actions. Austin sees each action as a card and applies it with one click; nothing changes until he does. Never claim something is fixed or changed: say what you proposed.
- For a bug in a project's code, propose create_task with a precise brief and acceptance criteria, then relaunch_tasks for it if Austin asked to fix it now.
- Keep answers short and plain. No jargon he doesn't need.

Rules you must keep:
- Never propose allowing rm, sudo, curl, wget, chmod, chown, ssh, scp, dd, mkfs, launchctl, git push, git reset --hard or git clean, package installs (pip, brew, npm -g), or commands in temp folders.
- Never propose reading a whole home folder, ~/Projects, or credential folders (.ssh, .aws, .gnupg, .config); name the specific folder.
- A launch check (requirement) must be a cheap "is the machine ready" command like docker info. Never a test run, install, or interpreter command.
- Never propose anything that deploys, pushes, publishes, touches a remote database, or deletes data.`;

/* Guard every proposed action with the same rules the blocker cards use. Returns why it's refused, or "". */
function chatCheck(a){
  const p = a.projectId ? proj(a.projectId) : null, t = a.taskId ? task(a.taskId) : null;
  const needP = ["allow_commands","add_read_dirs","add_requirement","remove_requirement","append_agent_notes","create_task"];
  if (needP.includes(a.type) && !p) return "unknown project";
  if (["update_task","unblock_task"].includes(a.type) && !t) return "unknown task";
  if (a.type === "allow_commands"){
    const bad = (a.rules || []).filter(r => !/^Bash\(.+\)$/.test(r) || NEVER_ALLOW.test(ruleCmd(r)) || /\b(pip3?|brew)\b.*\binstall\b|^\/(tmp|private\/tmp|var\/folders)\//.test(ruleCmd(r)));
    if (!(a.rules || []).length || bad.length) return "not allowed: " + (bad.join(", ") || "no rules");
  }
  if (a.type === "add_read_dirs"){
    const home = S.settings.home || "", norm = d => String(d).replace(/^~(?=\/|$)/, home).replace(/\/+$/, "");
    const bad = (a.dirs || []).filter(d => { const n = norm(d); return !n.startsWith("/") || n === home || n === home + "/Projects" || n.split("/").length < home.split("/").length + 2 || /\/\.(ssh|aws|gnupg|config)(\/|$)/.test(n); });
    if (!(a.dirs || []).length || bad.length) return "too broad: " + (bad.join(", ") || "no folders");
  }
  if (a.type === "add_requirement" && !goodCheck(a.check, p)) return "not a good launch check";
  if (a.type === "update_task" && Object.keys(a.fields || {}).some(k => !["title","detail","acceptance","status","deps","baseBranch","model","estTokens"].includes(k))) return "can't change those fields";
  if (a.type === "update_task" && a.fields?.status && !["todo","review","done","dropped","parked"].includes(a.fields.status)) return "bad status";
  if (["relaunch_tasks","merge_tasks"].includes(a.type) && !(a.taskIds || []).every(task)) return "unknown task";
  if (a.type === "create_task" && !(a.title && a.detail)) return "a task needs a title and a brief";
  if (a.type === "set_setting" && !["fixRounds","checksFixRounds","maxParallel","staggerSec","budgetGuard","defaultModel","verify"].includes(a.key)) return "can't change that setting here";
  return "";
}
/* A launch check is matched the way the page shows it: trimmed, inner spaces collapsed. A removal that matches nothing

const checkKey = c => String(c || "").trim().replace(/\s+/g, " ");
function withoutRequirement(requires, check){
  const list = requires || [], k = checkKey(check), kept = list.filter(r => checkKey(r.check) !== k);
  if (kept.length === list.length) throw new Error("No launch check matches \"" + String(check || "") + "\" on this project");
  return kept;
}
async function chatApply(a){
  const p = a.projectId ? proj(a.projectId) : null, t = a.taskId ? task(a.taskId) : null;
  if (a.type === "allow_commands") await patch("projects", p.id, { allowedTools: [...new Set([...allowedTools(p), ...a.rules])] });
  else if (a.type === "add_read_dirs") await patch("projects", p.id, { readDirs: [...new Set([...(p.readDirs || []), ...a.dirs])] });
  else if (a.type === "add_requirement") await patch("projects", p.id, { requires: [...(p.requires || []), { check: a.check, fix: a.fix || "" }] });
  else if (a.type === "remove_requirement") await patch("projects", p.id, { requires: withoutRequirement(p.requires, a.check) });
  else if (a.type === "append_agent_notes") await patch("projects", p.id, { agentNotes: ((p.agentNotes || "") + " " + a.text).trim() });
  else if (a.type === "update_task") await patch("tasks", t.id, { ...(a.fields || {}), ...(a.fields?.status === "done" ? { doneAt: now() } : {}) });
  else if (a.type === "unblock_task") await patch("tasks", t.id, { run: { ...t.run, blockerHandled: true, diagnosis: null } });
  else if (a.type === "relaunch_tasks"){ S.sel = new Set(a.taskIds); await launch(); }
  else if (a.type === "merge_tasks") await mergeSelected(a.taskIds);
  else if (a.type === "set_setting") saveSettings({ [a.key]: a.value });
  else if (a.type === "create_task"){
    const sp = S.sprints.find(s => s.id === a.sprintId && s.projectId === p.id) || S.sprints.filter(s => s.projectId === p.id && s.status !== "closed").sort(byOrder)[0];
    if (!sp) throw new Error("That project has no open sprint");
    const id = uid("t");
    await put("tasks", id, { title: a.title, detail: a.detail, acceptance: a.acceptance || "", estTokens: Math.round(a.estTokens || 150000), model: "sonnet", kind: "code", status: "todo",
      projectId: p.id, piId: sp.piId, sprintId: sp.id, order: tasksOf(sp.id).reduce((m, x) => Math.max(m, x.order || 0), 0) + 1, deps: [], createdAt: now(), source: "assistant" });
    a.createdId = id;
  }
}
const ACTION_LABEL = a => ({

  add_requirement: `Check ${a.check} before launching ${proj(a.projectId)?.name}`, remove_requirement: `Stop checking ${a.check} before launches`,

async function chatSend(text){
  const c = chatState(); text = String(text || "").trim();
  if (!text || c.busy) return;
  if (!S.sample){ toast(NEEDS_CLAUDE); return; }
  c.msgs.push({ role: "user", text, at: now() });
  const m = { role: "assistant", text: "", at: now(), actions: [] }; c.msgs.push(m); c.pending = m;
  c.busy = true; c.stream = ""; c.status = "Thinking"; c.ctl = new AbortController(); renderChat();
  const turns = c.msgs.slice(0, -1).slice(-16).map(x => ({ role: x.role, content: x.role === "assistant" ? (x.text || "(proposed fixes)") + ((x.actions || []).length ? "\n[Proposed: " + x.actions.map(a => `${ACTION_LABEL(a)} (${a.state})`).join("; ") + "]" : "") : x.text }));
  while (turns.length && turns[0].role !== "user") turns.shift();
  turns[0] = { role: "user", content: CHAT_INSTR + "\n\nToday is " + new Date().toDateString() + ".\n\nAustin: " + turns[0].content };
  try {
    const out = await S.sample(turns, { tools: chatTools(), modelTier: "complex", cache: false, signal: c.ctl.signal,
      onText: ({ text }) => { c.stream = text; c.status = ""; const el = document.querySelector(".chat .msg.live .body"); if (el) el.innerHTML = chatMd(text); } });
    m.text = out.text || c.stream || "(no answer)";
  } catch (e) {
    m.text = (c.stream ? c.stream + "\n\n" : "") + (e?.code === "cancelled" ? "Stopped." : e?.code === "rate_limited" ? "Claude is busy right now. Try again in a minute." : "Couldn't finish: " + (e?.message || e?.code || e));

}

      <span style="margin-left:auto;display:flex;gap:4px"><button class="btn sm quiet" data-act="chat-clear" title="Start over">Clear</button><button class="btn sm quiet icon" data-act="chat-toggle" aria-label="Close">${icon("x")}</button></span></div>

document.addEventListener("keydown", ev => {

  }
  if (o?.kind === "duel"){
    if (ev.key === "ArrowLeft"){ ev.preventDefault(); duelPick("a"); return; }
    if (ev.key === "ArrowRight"){ ev.preventDefault(); duelPick("b"); return; }
    if (ev.key === "="){ ev.preventDefault(); duelPick("tie"); return; }
    if (!typing && ev.key.toLowerCase() === "s"){ ev.preventDefault(); duelPick("skip"); return; }

    ev.preventDefault();
    const i = S.ideas.find(x => x.id === o.id), a = (i?.assumptions || []).find(x => x.id === o.selAs);
    if (a){ let importance = a.importance ?? 3, evidence = a.evidence ?? 0;
      if (ev.key === "ArrowUp") importance++; else if (ev.key === "ArrowDown") importance--;
      else if (ev.key === "ArrowLeft") evidence--; else evidence++;
      moveAssumptionTo(o.id, o.selAs, importance, evidence); }
    return;
  }
  if (ev.key === "Escape"){
    if (o){ if (o.kind === "planner" && planCtl) planCtl.abort(); S.overlay = null; render(); return; }
    if (S.menu || S.navOpen){ S.menu = null; S.navOpen = false; render(); return; }
    if (S.sel.size){ S.sel.clear(); render(); }
    return;
  }
  if (ev.target.id === "spark-in" && ev.key === "Enter"){ ev.preventDefault(); addSparkIdea(); return; }

  else if (ev.key === "k" || ev.key === "ArrowUp"){ ev.preventDefault(); S.kIdx = Math.max(0, S.kIdx - 1); S.kbdMoved = true; render(); }
  else if ((ev.key === "Enter" || ev.key === "o") && it){ ev.preventDefault(); if (it.t){ S.overlay = { kind:"task", id: it.t.id }; render(); } else if (it.kind === "launch") go("runs"); }

});
document.addEventListener("dragstart", ev => { const c = ev.target.closest?.("[data-drag]"); if (c){ ev.dataTransfer.setData("text/plain", c.dataset.drag); c.classList.add("dragging"); } });
document.addEventListener("dragend", ev => { ev.target.closest?.("[data-drag]")?.classList.remove("dragging"); });
document.addEventListener("dragover", ev => { const l = ev.target.closest?.("[data-lane]"); if (l){ ev.preventDefault(); l.classList.add("drop"); }
  const o = ev.target.closest?.("[data-opp]"); if (o){ ev.preventDefault(); o.classList.add("drop"); }
  const g = ev.target.closest?.("[data-asgrid]"); if (g) ev.preventDefault(); });
document.addEventListener("dragleave", ev => { const l = ev.target.closest?.("[data-lane]"); if (l && !l.contains(ev.relatedTarget)) l.classList.remove("drop");
  const o = ev.target.closest?.("[data-opp]"); if (o && !o.contains(ev.relatedTarget)) o.classList.remove("drop"); });
document.addEventListener("drop", ev => {
  const l = ev.target.closest?.("[data-lane]");
  if (l){ ev.preventDefault(); l.classList.remove("drop");
    const t = task(ev.dataTransfer.getData("text/plain")); const sp = S.sprints.find(s => s.id === l.dataset.lane);
    if (!t || !sp || t.sprintId === sp.id) return;
    patch("tasks", t.id, { sprintId: sp.id, piId: sp.piId, order: tasksOf(sp.id).reduce((m,x) => Math.max(m, x.order||0), 0) + 1 });
    return; }
  const g = ev.target.closest?.("[data-asgrid]");
  if (g){ ev.preventDefault();
    const rect = g.getBoundingClientRect(), x = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width)), y = Math.max(0, Math.min(1, (ev.clientY - rect.top) / rect.height));
    moveAssumptionTo(g.dataset.asgrid, ev.dataTransfer.getData("text/plain"), Math.round(5 - y * 4), Math.round(x * 3));
    return; }
  const o = ev.target.closest?.("[data-opp]"); if (!o) return; ev.preventDefault(); o.classList.remove("drop");
  const i = S.ideas.find(x => x.id === ev.dataTransfer.getData("text/plain")); if (!i) return;
  const oppId = o.dataset.opp === "__loose" ? null : o.dataset.opp;
  if ((i.opportunityId || null) === oppId) return;
  patch("ideas", i.id, { opportunityId: oppId });
});
/* Duel overlay: a swipe on the pair at phone width picks a side (swipe toward the card you want). */
let duelTouch = null;
document.addEventListener("touchstart", ev => {
  if (S.overlay?.kind !== "duel" || !ev.target.closest?.(".duel-pair")) return;
  duelTouch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
}, { passive: true });
document.addEventListener("touchend", ev => {
  if (!duelTouch) return;
  const t = ev.changedTouches[0], dx = t.clientX - duelTouch.x, dy = t.clientY - duelTouch.y;
  duelTouch = null;
  if (S.overlay?.kind !== "duel") return;
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) duelPick(dx > 0 ? "b" : "a");
}, { passive: true });
setInterval(() => { if (!document.hidden) $("#nav").innerHTML = navHTML(); }, 30000);

boot();
</script>
